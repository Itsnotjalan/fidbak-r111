{
  title:"Communication de masse", sub:"Lazarsfeld et Lewin", c:"#E5266F", cd:"#8E0F44",
  guide:`<p class="lead"><b>L’idée en une phrase :</b> les médias de masse nous manipulent-ils directement ? Les chercheurs de Columbia répondent : <b>non, leur effet est limité</b>, parce qu’il passe par des <b>personnes intermédiaires</b> (les leaders d’opinion). Kurt Lewin ajoute : certaines personnes <b>filtrent</b> ce qui passe (les gatekeepers).</p>
<div class="clair"><b>Le contexte</b> <span class="hc">pour comprendre</span> Dans les années 1920-1930, après la propagande de la Première Guerre mondiale (Lasswell, 1927, dans la bibliographie du cours), on pense que les médias ont un pouvoir <b>direct et énorme</b> sur des individus isolés, comme une piqûre qui injecterait les idées. Lazarsfeld va montrer que c’est beaucoup plus compliqué.</div>

<h4>Paul Lazarsfeld (1901-1976)</h4><ul>
<li>Sociologue <b>américain d’origine autrichienne</b> (né à Vienne)</li>
<li><b>École de Columbia</b>, <b>paradigme des effets limités</b></li>
<li>Avec <b>Merton et Gaudet</b> : il existe un <b>élément intermédiaire</b> entre le point initial et le point final</li>
<li><b>The People’s Choice (1944)</b> et <b>Personal Influence (1955, avec Katz)</b></li>
<li>Théorie : <b>two-step flow of communication</b></li></ul>
<div class="fiche"><div class="f-h">FICHE D’IDENTITÉ</div><dl>
<dt>Nom</dt><dd>Paul Lazarsfeld (1901-1976)</dd>
<dt>Qui ?</dt><dd>Sociologue américain d’origine autrichienne, né à Vienne</dd>
<dt>Où ?</dt><dd>École de Columbia (New York)</dd>
<dt>Avec qui ?</dt><dd>Merton et Gaudet ; puis Elihu Katz</dd>
<dt>Œuvres</dt><dd><i>The People’s Choice</i> (1944) ; <i>Personal Influence: the part played by people in the flow of mass communication</i> (1955, avec Katz)</dd>
<dt>Idée clé</dt><dd>Paradigme des <b>effets limités</b> : un élément intermédiaire existe entre le point de départ et le point d’arrivée de la communication</dd>
<dt>Théorie</dt><dd>Le <b>two-step flow of communication</b> (communication à deux étages)</dd></dl></div>
<div class="clair"><b>En clair</b> Pour <i>The People’s Choice</i>, Lazarsfeld et son équipe suivent des électeurs américains pendant la campagne présidentielle de 1940. Surprise : les gens changent peu d’avis à cause des médias. Ils sont bien plus influencés par les <b>personnes de leur entourage</b>. Les médias touchent d’abord quelques personnes très attentives, qui transmettent ensuite à leur entourage : l’information circule en <b>deux étages</b>.</div>
<div class="sch">MÉDIAS → 1er étage → LEADERS D’OPINION → 2e étage → PUBLIC</div>
<ul><li><b>Leader d’opinion</b> : très exposé aux médias, il filtre, interprète et relaie l’info</li></ul>
<div class="clair"><b>Le leader d’opinion, en clair</b> C’est une personne <b>très exposée aux médias</b>, qui <b>filtre et interprète</b> l’information selon son point de vue, puis la <b>relaie</b> à son entourage. Ce n’est pas forcément une star : ce peut être un voisin, un collègue, un ami « qui s’y connaît ».</div>
<div class="ex"><b>Exemple</b> Ton pote regarde toutes les vidéos tech. Toi, non. Quand tu veux acheter un PC, c’est lui qui te conseille : l’info des vidéos (1er étage) t’arrive à travers lui (2e étage). C’est lui le leader d’opinion.</div>
<div class="why"><b>Effets limités : pourquoi « limités » ?</b> Parce que les médias n’agissent pas directement sur tout le monde : leur effet est <b>filtré par les relations personnelles</b>. Les médias comptent, mais moins qu’on le pensait.</div>

<h4>Kurt Lewin (1890-1947)</h4><ul>
<li>Psychologue germano-américain</li>
<li>Stratégies de persuasion pour <b>changer les habitudes de cuisine des maîtresses de maison</b></li>
<li>Notion de <b>gatekeeper</b> (contrôleur d’information), qui <b>complète la notion de leader d’opinion informel</b></li></ul>
<div class="fiche"><div class="f-h">FICHE D’IDENTITÉ</div><dl>
<dt>Nom</dt><dd>Kurt Lewin (1890-1947)</dd>
<dt>Qui ?</dt><dd>Psychologue germano-américain (né en Allemagne, parti aux États-Unis dans les années 1930)</dd>
<dt>Terrain</dt><dd>Des stratégies de persuasion pour changer les habitudes de cuisine des maîtresses de maison</dd>
<dt>Idée clé</dt><dd>Le <b>gatekeeper</b> (« gardien de la porte ») ou contrôleur d’information</dd>
<dt>Lien</dt><dd>Il <b>complète</b> la notion de leader d’opinion (Lazarsfeld) par celle de leader d’opinion <b>informel</b></dd></dl></div>
<div class="clair"><b>En clair</b> <span class="hc">pour comprendre</span> Pendant la Seconde Guerre mondiale, les autorités américaines veulent que les familles mangent des morceaux de viande moins appréciés (les abats), à cause des pénuries. Lewin se demande : <b>qui décide de ce qui arrive dans l’assiette ?</b> Réponse : la maîtresse de maison, qui achète et cuisine. C’est elle qui « garde la porte » de la cuisine : c’est le <b>gatekeeper</b>. Pour changer les habitudes, il faut la convaincre elle. Lewin récupère des techniques venues de la publicité pour faire de la communication <b>persuasive</b>.</div>
<div class="sch">INFORMATION → [ PORTE contrôlée par le GATEKEEPER ] → PUBLIC</div>
<div class="ex"><b>Gatekeepers d’aujourd’hui</b> Le rédacteur en chef qui choisit les sujets du JT ; le modérateur d’un serveur Discord ; l’algorithme de Google ou de TikTok qui décide ce que tu vois en premier.</div>
<table class="tbl"><tr><th></th><th>Leader d’opinion (Lazarsfeld)</th><th>Gatekeeper (Lewin)</th></tr>
<tr><td><b>Ce qu’il fait</b></td><td>Il <b>influence</b> : il interprète et donne son avis</td><td>Il <b>filtre</b> : il décide ce qui passe ou non</td></tr>
<tr><td><b>Image</b></td><td>Un relais entre les médias et le public</td><td>Une porte avec un gardien</td></tr>
<tr><td><b>Exemple</b></td><td>Un influenceur, le pote qui s’y connaît</td><td>Un algorithme, un modérateur, une rédaction</td></tr></table>

<h4>Bilan et perspectives (phrase du prof)</h4><ul>
<li>Une communication d’influence, au niveau des mass media, avec une portée politique</li>
<li>Aujourd’hui : influenceurs = leaders d’opinion ; Google et algorithmes = gatekeepers</li></ul>

<div class="warn">Le leader d’opinion INFLUENCE. Le gatekeeper FILTRE.</div>

{
  title:"Communication télégraphique", sub:"Shannon, Weaver, Wiener, Turing", c:"#C21F3A", cd:"#6E0C1D",
  guide:`<p class="lead"><b>L’idée en une phrase :</b> après la guerre, des ingénieurs décrivent la communication comme la <b>transmission d’un signal entre machines</b>, comme un télégramme qui part d’un point A et arrive à un point B. Shannon en fait une <b>ligne</b> ; Wiener en fait un <b>cercle</b> grâce au feed-back.</p>

<h4>Définition</h4><ul><li>Terme apparu <b>fin XVIIIe</b> : transmission d’un message d’un point A à un point B grâce à des <b>machines</b> et des <b>codes</b></li>
<li>Une analogie directe avec les <b>sciences exactes</b></li></ul>
<div class="clair"><b>En clair</b> Le télégraphe est une machine qui envoie des messages <b>codés</b> (le morse, par exemple) à distance : ce sont les « télégrammes ». Parler de communication <b>télégraphique</b>, c’est voir toute communication comme ça : un message est codé, voyage dans un canal, puis est décodé à l’arrivée. Plusieurs chercheurs universitaires ont proposé des schémas pour modéliser ce fonctionnement.</div>
<div class="why"><b>Pourquoi ça te concerne en BUT Info</b> C’est exactement ce que fait un réseau informatique : encoder des données, les envoyer dans un canal qui peut être perturbé, les décoder. La théorie de Shannon est à la base de la compression (zip, mp3) et des codes correcteurs d’erreurs.</div>

<h4>Claude Shannon</h4><ul><li><b>Ingénieur électricien</b> aux <b>Bell Telephone Laboratories</b> (AT&amp;T)</li>
<li>Études sur la <b>cryptographie</b> et les codes secrets de la 2e Guerre mondiale</li>
<li><b>1948 : The Mathematical Theory of Communication</b> (avec <b>Warren Weaver</b>, mathématicien)</li></ul>
<div class="fiche"><div class="f-h">FICHE D’IDENTITÉ</div><dl>
<dt>Nom</dt><dd>Claude Elwood Shannon (1916-2001)</dd>
<dt>Qui ?</dt><dd>Ingénieur électricien aux Bell Telephone Laboratories (AT&amp;T) ; élève de Norbert Wiener</dd>
<dt>Travaux</dt><dd>Cryptographie et codes secrets de la Seconde Guerre mondiale (décrypter les codes ennemis)</dd>
<dt>Œuvre</dt><dd><b>1948</b> : <i>The Mathematical Theory of Communication</i>, avec Warren Weaver (mathématicien, que tes notes présentent comme philosophe-mathématicien)</dd>
<dt>Idée clé</dt><dd>Un schéma <b>linéaire</b> de la communication entre machines ; la notion de <b>bruit</b></dd>
<dt>Titre</dt><dd>Le père de la <b>théorie de l’information</b></dd></dl></div>
<div class="ex"><b>Pour comprendre la date</b> <span class="hc">hors cours</span> En 1948, Shannon publie seul un article fondateur ; en 1949, le livre avec Weaver rend le schéma célèbre. Pour le contrôle, retiens <b>1948</b>, comme dans le cours.</div>
<div class="sch">SOURCE → ÉMETTEUR → CODAGE → MESSAGE → DÉCODAGE → RÉCEPTEUR<br>BRUITS ↓ sur le message · CANAL ↑ sous le message</div>
<table class="tbl"><tr><th>Élément</th><th>Rôle</th><th>Dans un appel téléphonique</th></tr>
<tr><td><b>Source</b></td><td>Produit le message (énonce l’information)</td><td>Toi, qui as quelque chose à dire</td></tr>
<tr><td><b>Émetteur</b></td><td>Envoie le message</td><td>Ton téléphone qui capte ta voix</td></tr>
<tr><td><b>Codage</b></td><td>Transforme le message en signal</td><td>La voix devient un signal numérique</td></tr>
<tr><td><b>Message</b></td><td>Ce qui est transporté</td><td>Le signal qui voyage</td></tr>
<tr><td><b>Canal</b></td><td>Le support qui transporte le message</td><td>Le réseau, les ondes</td></tr>
<tr><td><b>Bruit</b></td><td>Tout ce qui brouille le message</td><td>Grésillements, coupure dans le métro</td></tr>
<tr><td><b>Décodage</b></td><td>Retransforme le signal en message</td><td>Le téléphone de ton ami reconstitue ta voix</td></tr>
<tr><td><b>Récepteur</b></td><td>Reçoit et reconstitue le message pour le destinataire</td><td>Ton ami qui t’entend</td></tr></table>
<ul><li><b>Bruit</b> : ce qui perturbe le message ; <b>limite</b> : trop simple pour l’humain, bon pour les machines</li></ul>
<div class="clair"><b>Pourquoi le bruit ?</b> Shannon et Weaver introduisent le bruit pour comprendre le <b>brouillage</b> des messages codés pendant la guerre. La source énonce un message, il est codé, acheminé par un canal qui peut être brouillé, puis le récepteur le décode et le reconstitue pour le destinataire.</div>
<div class="trap"><b>La limite (à savoir rédiger)</b> Le schéma est <b>linéaire</b> et à <b>sens unique</b> : pas de retour, pas d’émotions, pas de contexte, pas de sens. Il est pertinent pour les <b>machines</b>, mais trop simple et incomplet pour la communication <b>humaine</b>. Depuis 1949, de nombreux schémas ont montré la complexité de la communication humaine.</div>

<h4>Norbert Wiener</h4><ul><li><b>Ingénieur</b>, <b>professeur de Shannon</b></li>
<li>Chargé de l’<b>ajustement des tirs de la DCA</b> → découvre le <b>feed-back</b></li>
<li><b>1948 : Cybernetics</b> or Control and Communication in the Animal and the Machine</li></ul>
<div class="fiche"><div class="f-h">FICHE D’IDENTITÉ</div><dl>
<dt>Nom</dt><dd>Norbert Wiener (1894-1964)</dd>
<dt>Qui ?</dt><dd>Ingénieur (et mathématicien), <b>professeur de Shannon</b></dd>
<dt>Mission</dt><dd>L’ajustement des tirs de la <b>DCA</b> (défense contre les avions) pendant la guerre</dd>
<dt>Découverte</dt><dd>Le phénomène du <b>feed-back</b> (rétroaction)</dd>
<dt>Œuvre</dt><dd><b>1948</b> : <i>Cybernetics or Control and Communication in the Animal and the Machine</i></dd>
<dt>Idée clé</dt><dd>Un schéma <b>circulaire</b> ; une approche <b>cybernétique</b></dd></dl></div>
<div class="clair"><b>D’où vient le feed-back ?</b> Pour toucher un avion qui bouge, on tire, on <b>observe l’écart</b>, puis on <b>corrige</b> le tir suivant. Le résultat revient modifier l’action : c’est une <b>boucle</b>. Wiener en conclut que la communication n’est pas une ligne mais un <b>cercle</b>. D’après tes notes, il pense même que la guerre s’explique en grande partie par un problème de communication, et il dépasse le modèle mathématique par une réflexion philosophique.</div>
<div class="sch">Cercle : source → encoder → signal émis → canal → signal reçu → décoder → destinataire → encoder → … → source<br>Au centre : BRUIT et FEED-BACK</div>
<ul><li><b>Feed-back positif</b> : accentue ; <b>négatif</b> : régule, amortit (thermostat)</li>
<li><b>Cybernétique</b> : analyser globalement le système, tous les éléments et leurs interactions</li></ul>
<div class="clair"><b>Feed-back, la définition</b> L’action d’un élément sur un autre entraîne un <b>retour</b>, une réponse du deuxième élément vers le premier. Les deux sont reliés par une <b>boucle de rétroaction</b> : d’où le schéma circulaire.</div>
<table class="tbl"><tr><th>Feed-back</th><th>Effet</th><th>Exemple</th></tr>
<tr><td><b>Positif</b></td><td><b>Accentue</b> un phénomène (ça s’emballe)</td><td>L’effet Larsen : un micro près d’une enceinte, le son tourne en boucle et devient strident ; une rumeur qui enfle</td></tr>
<tr><td><b>Négatif</b></td><td><b>Régule</b>, amortit un phénomène (ça se stabilise)</td><td>Le thermostat : trop chaud, le chauffage se coupe ; le prof voit des têtes perdues et réexplique</td></tr></table>
<div class="clair"><b>Cybernétique, en clair</b> <span class="hc">pour comprendre</span> Le mot vient du grec <i>kubernêtês</i>, le pilote qui tient le gouvernail. La cybernétique, c’est la science du <b>pilotage</b> et du <b>contrôle</b> : on regarde le système en entier, tous les éléments engagés et leurs <b>interactions</b>.</div>
<table class="tbl"><tr><th></th><th>Shannon &amp; Weaver</th><th>Wiener</th></tr>
<tr><td><b>Forme</b></td><td>Linéaire</td><td>Circulaire</td></tr>
<tr><td><b>Retour</b></td><td>Aucun</td><td>Feed-back</td></tr>
<tr><td><b>Ce qu’on regarde</b></td><td>La transmission du signal</td><td>Le système entier et ses interactions</td></tr>
<tr><td><b>Mot-clé</b></td><td>Bruit</td><td>Rétroaction, cybernétique</td></tr>
<tr><td><b>Date</b></td><td>1948</td><td>1948</td></tr></table>

<h4>Test de Turing (1950)</h4><ul><li>Un humain converse à l’aveugle, par écrit, avec une machine et un humain : s’il ne les distingue pas, la machine réussit</li></ul>
<div class="clair"><b>En clair</b> Alan Turing le décrit en 1950 dans <i>Computing Machinery and Intelligence</i>. C’est un test d’intelligence artificielle fondé sur la capacité d’une machine à <b>imiter la conversation humaine</b>. Pour rester simple et universel, la conversation se fait uniquement par messages écrits. Aujourd’hui, c’est la question qu’on se pose devant les chatbots.</div>

<h4>Bilan (phrase du prof)</h4><ul><li>Schéma <b>linéaire</b> avec Shannon, <b>circulaire</b> avec Wiener</li><li>Portée <b>universelle</b>, beaucoup de retentissement</li><li>Les <b>conférences Macy</b></li></ul>
<div class="clair"><b>En clair</b> Ces modèles ont eu un énorme <b>retentissement</b> : ils servent aussi bien aux ingénieurs qu’aux chercheurs en sciences humaines. Les <b>conférences Macy</b> sont des rencontres entre chercheurs de disciplines très différentes (mathématiques, ingénierie, anthropologie, psychologie) autour de la cybernétique. C’est là que <b>Bateson rencontre Wiener</b> : c’est le pont vers le cours suivant, la communication orchestrale.</div>
<div class="warn">Shannon n’a PAS inventé le binaire : il est le père de la théorie de l’information.</div>
<div class="exam"><b>Au contrôle, on peut te demander</b><ul>

<li>Le feed-back (positif / négatif) et la cybernétique</li>
<li>Le bilan : linéaire vs circulaire, portée universelle, conférences Macy</li></ul></div>`,

{
  title:"Communication orchestrale", sub:"Palo Alto, Bateson, Birdwhistell, Hall", c:"#F0476B", cd:"#9E2243",
  guide:`<p class="lead"><b>L’idée en une phrase :</b> contre Shannon, des chercheurs affirment que la communication humaine n’est pas un câble entre deux machines, mais un <b>orchestre</b> où tout le monde joue en même temps : les mots, les gestes, les distances, les silences. <b>Tout communique.</b></p>

<h4>La communication orchestrale</h4><ul>
<li>Des chercheurs en sciences sociales prennent le <b>contre-pied de Shannon</b> : chaque situation est complexe et nécessite un modèle propre</li>
<li>Inspiration <b>cybernétique (Wiener)</b> qui débouche sur une <b>anthropologie</b></li>
<li>Métaphore de l’<b>orchestre</b> : <b>tout communique</b>, la communication est un tout intégré (voix, gestes, non-verbal)</li>
<li><b>Collège invisible</b> : réseau de chercheurs aux connexions croisées, d’accord sur l’<b>existence de codes du comportement</b></li>
<li><b>Palo Alto</b> : banlieue sud de San Francisco, près de Stanford et de l’hôpital psychiatrique où Bateson travaillera</li></ul>
<div class="clair"><b>La métaphore de l’orchestre, en clair</b> Dans le modèle télégraphique, un émetteur parle, puis un récepteur reçoit. Dans un orchestre, <b>tout le monde joue et écoute en même temps</b>, en suivant une « partition » que personne n’a écrite : les codes de sa culture. Communiquer, c’est entrer dans cet orchestre : en lisant et en jouant, chacun participe à une grande symphonie, même quand il se tait.</div>
<div class="ex"><b>Exemple</b> Ton prof dit « très bien » en levant les yeux au ciel. Avec Shannon, on ne garde que les mots : « très bien ». Avec l’orchestre, on lit tout : le ton, le regard, la posture… et on comprend que ce n’est pas très bien du tout.</div>
<div class="clair"><b>Définition de tes notes</b> La communication orchestrale, c’est la communication dans son ensemble : elle ne se limite pas à un échange verbal, elle intègre <b>tous les signaux</b> partagés entre deux humains (la voix, l’intonation, les gestes, le non-verbal).</div>

<h4>Gregory Bateson</h4><ul>
<li>Anthropologue, famille prestigieuse, <b>père éminent zoologiste</b></li>
<li><b>Naven (1936)</b> : la société d’un point de vue systémique</li>
<li><b>Années 1940</b> : conférences Macy, rencontre avec Wiener</li>
<li><b>1951</b> : Communication: the Social Matrix of Psychiatry (avec <b>Jurgen Ruesch</b>)</li>
<li>« La communication est la <b>matrice</b> dans laquelle sont enchâssées toutes les activités humaines »</li>
<li><b>4 niveaux</b> : intrapersonnel (le self), interpersonnel (2), groupal (plusieurs), culturel (nombreux)</li>
<li>Mental Research Institute : <b>Don Jackson, Paul Watzlawick, Janet Beavin</b></li>
<li><b>Double bind</b> (double contrainte, injonction paradoxale) : « Sois spontané ! »</li>
<li>« <b>On ne peut pas ne pas communiquer</b> »</li></ul>
<div class="fiche"><div class="f-h">FICHE D’IDENTITÉ</div><dl>
<dt>Nom</dt><dd>Gregory Bateson</dd>
<dt>Qui ?</dt><dd>Anthropologue (aussi psychologue et épistémologue d’après tes notes), d’une famille prestigieuse : son <b>père était un éminent zoologiste</b></dd>
<dt>Rôle</dt><dd>L’un des piliers, cofondateur de la communication orchestrale ; travaille à Palo Alto</dd>
<dt>Œuvres</dt><dd><i>Naven</i> (<b>1936</b>) ; <i>Communication: the Social Matrix of Psychiatry</i> (<b>1951</b>, avec Jurgen Ruesch)</dd>
<dt>Rencontre</dt><dd><b>1940</b> (selon le cours) : conférences Macy, rencontre avec Wiener</dd>
<dt>Idées clés</dt><dd>Tout communique ; 4 niveaux de communication ; le double bind</dd></dl></div>
<div class="clair"><b>Naven et le « systémique », en clair</b> <i>Naven</i> étudie une cérémonie d’un peuple de Nouvelle-Guinée (les Iatmul). Bateson ne regarde pas chaque personne isolément mais les <b>relations</b> entre elles : c’est le point de vue <b>systémique</b> (global), directement inspiré de la cybernétique de Wiener.</div>
<div class="clair"><b>La citation du cours</b> « La communication ne se rapporte pas seulement à la transmission de messages verbaux, explicites et intentionnels […] elle inclurait l’ensemble des processus par lesquels les sujets s’influencent mutuellement. […] Toute action et tout événement offrent des aspects communicatifs dès qu’ils sont perçus par l’être humain. »</div>
<table class="tbl"><tr><th>Les 4 niveaux de Bateson</th><th>Qui ?</th><th>Exemple</th></tr>
<tr><td><b>Intrapersonnel</b></td><td>Le champ d’observation se limite au <b>self</b> (soi-même)</td><td>Tu te parles à toi-même avant le contrôle</td></tr>
<tr><td><b>Interpersonnel</b></td><td><b>Deux</b> individus</td><td>Une conversation avec ton pote</td></tr>
<tr><td><b>Groupal</b></td><td><b>Plusieurs</b> individus</td><td>Ton groupe de TD qui prépare un exposé</td></tr>
<tr><td><b>Culturel</b></td><td><b>De nombreux</b> individus</td><td>Toute une société et ses codes</td></tr></table>
<div class="clair"><b>Le double bind, en clair</b> Deux ordres <b>contradictoires</b> (l’un explicite, l’autre implicite) : le récepteur ne peut pas obéir à l’un sans désobéir à l’autre, et pourtant il doit choisir. Exemple : « Sois spontané ! » Si tu obéis, tu n’es plus spontané. Autre exemple : un parent dit « viens me faire un câlin » mais se raidit quand l’enfant approche.</div>
<div class="clair"><b>« On ne peut pas ne pas communiquer », en clair</b> Même le silence est un message : ignorer quelqu’un, détourner le regard, ne pas répondre à un message… tout cela « dit » quelque chose. Cette idée est développée au Mental Research Institute par Don Jackson, Paul Watzlawick et Janet Beavin.</div>
<div class="ex"><b>Ton projet</b> Le parallèle à faire avec l’<b>expérience de Milgram</b> (et l’émission « Le jeu de la mort ») : l’expérience mesure le pouvoir qu’une autorité exerce sur des individus. Tu peux y repérer les 4 niveaux de Bateson et des situations de double contrainte (obéir à l’autorité ou à sa conscience).</div>

<h4>Ray Birdwhistell</h4><ul>
<li>Anthropologue : le corps est un <b>signifiant majeur</b> (gestes, poses)</li>
<li>Études : rituels amoureux GI/Anglaises, Indiens Kutenai, film sur un trilingue</li>
<li>La <b>kinésique</b> (gestualité) ; <b>kinème</b> = unité gestuelle de sens ; puis odorat, toucher, espace, temps</li></ul>
<div class="fiche"><div class="f-h">FICHE D’IDENTITÉ</div><dl>
<dt>Nom</dt><dd>Ray Birdwhistell</dd>
<dt>Qui ?</dt><dd>Anthropologue</dd>
<dt>Idée clé</dt><dd>Le corps est un <b>signifiant majeur</b> : les gestes et les poses ont un sens</dd>
<dt>Études</dt><dd>Les rituels amoureux entre GI américains et jeunes Anglaises ; les Indiens Kutenai ; un film sur une personne trilingue</dd>
<dt>Concepts</dt><dd>La <b>kinésique</b> (anthropologie de la gestualité) ; le <b>kinème</b></dd>

<div class="clair"><b>En clair</b> <b>Communication non verbale</b> : dans toute situation de communication, les gestes, les expressions et les poses ont de l’importance et véhiculent un sens. Le <b>kinème</b> est la plus petite <b>unité gestuelle</b> qui a un sens, comme le phonème est la plus petite unité de son d’une langue : un haussement de sourcil, un hochement de tête.</div>
<div class="ex"><b>Pourquoi un film sur un trilingue ?</b> Quand une même personne passe d’une langue à l’autre, ses gestes changent aussi. Preuve que les gestes ne sont pas « naturels » : ils sont <b>appris</b>, ils font partie de la culture.</div>

function tone(f1,f2,dur,type,vol,dl){ const c=ac(), t=c.currentTime+(dl||0), o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(sfxBus()); o.start(t); o.stop(t+dur+0.05); }
function noise(dur,ftype,freq,vol,dl){ const c=ac(), t=c.currentTime+(dl||0), n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type=ftype; f.frequency.value=freq; const g=c.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(sfxBus()); s.start(t); }
function sfx(kind){
  if(!S.sound || !AUD.on) return;
  try{
    ({
      good:()=>{ tone(660,660,.15,'triangle',.16); tone(990,990,.18,'triangle',.16,.09); },

      hover:()=>{ tone(2350,2350,.032,'sine',.03); tone(4700,4700,.018,'triangle',.012); },

      open:()=>{ sweep(.24,380,4200,.26,0,1.1); tone(392,784,.2,'sine',.035,.02); },
      close:()=>{ sweep(.18,3600,480,.2,0,1.1); },
      notif:()=>{ tone(1568,1568,.07,'triangle',.05); tone(2093,2093,.11,'triangle',.05,.07); },
      swish:()=>{ sweep(.2,700,5600,.24); },
      slam:()=>{ tone(120,52,.28,'sine',.3); noise(.12,'lowpass',1400,.45); },
      bad:()=>{ tone(180,140,.22,'sawtooth',.05); tone(120,90,.25,'sawtooth',.05,.12); },
      laugh:()=>{ [0,.11,.22,.33].forEach((d,i)=>tone(340-i*25,300-i*25,.08,'square',.05,d)); },
      roar:()=>{ tone(140,60,.6,'sawtooth',.07); noise(.55,'lowpass',500,.35); },
      win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.2,'triangle',.15,i*.11)),
      transfo:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,f,.18,'triangle',.14,i*.07)),
      levelup:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,f,.16,'square',.05,i*.08)),
      kiss:()=>{ tone(1300,450,.14,'sine',.2); tone(1500,700,.12,'sine',.12,.16); noise(.05,'highpass',3000,.15,.12); },
      squeak:()=>{ tone(900,1800,.12,'sine',.15); tone(1800,1200,.1,'sine',.1,.12); },
      boing:()=>tone(220,520,.18,'sine',.14),
      chomp:()=>{ tone(160,80,.09,'square',.08); tone(160,80,.09,'square',.08,.13); },
      growl:()=>{ tone(90,60,.9,'sawtooth',.06); noise(.8,'lowpass',300,.3); },
      sting:()=>{ tone(110,108,.6,'sawtooth',.05); tone(165,160,.6,'sawtooth',.04); tone(233,230,.6,'sawtooth',.03); },

      glass:()=>{ noise(.9,'highpass',2400,.8); noise(.4,'bandpass',5000,.5,.05); for(let i=0;i<16;i++){ const f=2200+Math.random()*4200; tone(f,f*.97,.1+Math.random()*.08,'sine',.045,.02+Math.random()*.6); } },
      creak:()=>{ for(let i=0;i<5;i++){ const f=3000+Math.random()*2000; tone(f,f*.9,.05,'sine',.03,i*.07+Math.random()*.05); } },
      heartbeat:()=>{ [0,.32,1.0,1.32].forEach((d,i)=>tone(70,42,.2,'sine',i%2?.35:.5,d)); },
      rumble:()=>{ noise(1.6,'lowpass',160,.9); tone(48,38,1.4,'sine',.25); },

function trackEyes(){
  ptrRAF = 0; if(!ptr) return;
  document.querySelectorAll('svg.track').forEach(sv=>{
    const r = sv.getBoundingClientRect(); if(!r.width) return;
    let dx = (ptr[0]-(r.left+r.width/2))/(r.width*1.1), dy = (ptr[1]-(r.top+r.height*.48))/(r.height*1.1);

function check(){
  const btn = $('#checkBtn'); if(!btn || btn.disabled || L.state!=='ask') return;
  const e = L.cur; let ok = false, sol = '';
  if(e.t==='mcq' || e.t==='fill'){

    ok = L.ans.map(i=>L.tiles[i]).join('|')===e.o.join('|'); sol = e.o.join(' → ');

}

function resolveCore(ok, sol, opt){
  opt = opt || {};
  L.state = 'done'; const e = L.cur; let line, title, faceStage, faceMood;
  const before = stageNow();
  if(ok){
    L.done++; L.consec = 0;
    if(!opt.noCombo){ L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo); S.best = Math.max(S.best||0, L.combo); }
    if(!opt.keepWrong) S.wrong = S.wrong.filter(w=>w!==e.id);
    L.gotItems.push(...addXp(2));
    const c = L.combo;
    if(opt.line) line = opt.line;
    else if(c===5) line = rnd(TRANSFO);
    else if(c>5) line = COMBO_SPECIAL[c] || rnd(KAWAII);
    else line = rnd(STAGE_LINES[Math.max(1,c)]);
    title = opt.noCombo ? 'Bof.' : GOOD_T[Math.min(6, Math.max(1,c))];
    faceStage = stageNow(); faceMood = null;
    if(c===5 && !opt.noCombo){
      sfx('transfo'); flash(); confetti(true);
      if(!L.streakBonus){ L.streakBonus = true; addBond(2); }
      setTimeout(()=>kiss(1), 450);
    } else if(!opt.noCombo && (c===10 || c===15 || c===20)){ sfx('good'); setTimeout(()=>kiss(c===10?2:3), 350); }
    else sfx('good');
  } else {
    const lost = L.combo;
    L.hearts--; L.mistakes++; L.combo = 0; L.consec++;
    if(!S.wrong.includes(e.id)) S.wrong.push(e.id);
    if(L.hearts>0) L.queue.push(e);
    line = L.hearts===0 ? rnd(ROAST_DEAD)
         : lost>=5 ? rnd(ROAST_BETRAYAL)
         : L.hearts===1 ? rnd(ROAST_LAST)
         : L.consec>=2 ? rnd(ROAST_STREAK) : rnd(ROAST);
    title = L.hearts===0 ? 'C’EST FINI.' : rnd(BAD_T); faceStage = 0; faceMood = 'rage';
    sfx('bad');
    const h = $('#hearts'); h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit'); heartBreak();
    const cb = document.querySelector('.ex-kind .combo'); if(cb) cb.remove();
    stopKawaii();
  }
  save();
  $('#pbar').style.width = Math.round(100*L.done/L.total)+'%';
  $('#hearts').innerHTML = `❤️ <b>${L.hearts}</b>`;
  $('#mood').outerHTML = moodRow();
  const foot = $('#lfoot');
  foot.className = 'l-foot ' + (ok?'good':'bad');
  const dead = !ok && L.hearts===0;
  foot.innerHTML = `<div class="l-in"><div class="sheet-in"><div class="sheetm" id="sheetm">${mon(faceStage,72,faceMood)}</div><div class="sheet-t">
      <h3>${esc(title)}</h3><p class="line">${esc(line)}</p>
      ${!ok ? `<p class="sol">Bonne réponse : ${esc(sol)}</p>` : ''}
      ${!ok && e.ex ? `<p class="exp">${esc(e.ex)}</p>` : ''}
    </div></div>
    <button class="btn wide ${ok?'good':'bad'}" id="nextBtn" onclick="next()" ${dead?'disabled':''}>${dead?'…':'Continuer'}</button></div>`;
  const askEl = $('#askm');
  if(ok){
    setAsk(faceStage, null, faceStage!==before ? 'tf' : null);
    if(askEl){ askEl.classList.remove('nom'); void askEl.offsetWidth; askEl.classList.add('nom'); floatAt(askEl, '+2 ⚡', 'xp', 0); }
    if(faceStage>=5){ startKawaii(); if(L.combo>5) burst(askEl, ['💋','♡'], 'heart', 2); }
  } else {
    setAsk(0, 'rage');
    if(dead){ setTimeout(ko, 1300); return; }
    setTimeout(()=>{ if(L && L.state==='done' && L.cur===e){ setAsk(0,'laugh'); sfx('laugh'); burst(askEl || $('#sheetm'), HAHA, 'haha', L.consec>=2?5:3); } }, 650);
  }
}
function next(){
  if(!L || L.state!=='done') return;
  if(L.hearts<=0) return ko();

}

const noEmoji = s => String(s).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{1F900}-\u{1F9FF}]/gu,'').trim();

}
function drawOrder(){
  const n = L.tiles.length, ends = L.cur.ends || ['Début','Fin'];
  let s = '';
  for(let k=0;k<n;k++){
    if(k) s += `<span class="ord-arr" aria-hidden="true">➜</span>`;

    if(ti!==undefined) s += `<button class="oslot full" onclick="unplace(${k})" aria-label="Case ${k+1} : ${esc(L.tiles[ti])}"><i>${k+1}</i><span>${esc(L.tiles[ti])}</span></button>`;
    else s += `<div class="oslot ${k===L.ans.length?'next':''}"><i>${k+1}</i><span class="ph">${k===0?esc(noEmoji(ends[0])):k===n-1?esc(noEmoji(ends[1])):'…'}</span></div>`;

  $('#bank').innerHTML = L.tiles.map((t,i)=>`<button class="tile ${L.ans.includes(i)?'used':''}" onclick="place(${i})" style="animation-delay:${i*45}ms">${esc(t)}</button>`).join('');
  enableCheck(L.ans.length===L.tiles.length);
}
function place(i){
  if(L.state!=='ask' || L.ans.includes(i)) return;
  const b = $('#bank') && $('#bank').children[i]; const from = b ? b.getBoundingClientRect() : null;
  L.ans.push(i); sfx('tick'); drawOrder();
  $('#bank').classList.add('settled');

  if(from && slot && slot.animate){

  }
}
function unplace(k){ if(L.state!=='ask') return; L.ans.splice(k,1); sfx('tick'); drawOrder(); $('#bank').classList.add('settled'); }
function markOrder(ok){
  const line = $('#ansLine'); line.classList.add(ok?'ok':'bad');

function cTool(t){

}
function cColor(c){ C.color[C.tool] = c; cTool(C.tool); sfx('tick'); }
function cSize(){
  const page = $('#cpage'); if(!page || !C.cv) return;
  const w = page.clientWidth, h = page.scrollHeight, dpr = Math.min(2, window.devicePixelRatio||1);
  C.w = w; C.cv.style.width = w+'px'; C.cv.style.height = h+'px';
  C.cv.width = Math.round(w*dpr); C.cv.height = Math.round(h*dpr);
  C.ctx.setTransform(dpr,0,0,dpr,0,0); cDraw();
}
function cPt(e){ const r = C.cv.getBoundingClientRect(); return [(e.clientX-r.left)/C.w, (e.clientY-r.top)/C.w]; }
function cDown(e){
  if(C.tool==='read') return;
  e.preventDefault(); C.cv.setPointerCapture(e.pointerId);
  const p = cPt(e);
  if(C.tool==='eraser'){ C.hist.push(JSON.stringify(C.strokes)); C.cur = {erase:true, changed:false}; cErase(p); return; }
  C.hist.push(JSON.stringify(C.strokes)); if(C.hist.length>40) C.hist.shift();
  const pr = e.pointerType==='pen' && e.pressure ? .6 + e.pressure*.8 : 1;
  C.cur = {t:C.tool, c:C.color[C.tool], w:(C.tool==='hl' ? 18 : 2.6*pr)/C.w, p:[+p[0].toFixed(4), +p[1].toFixed(4)]};
  C.strokes.push(C.cur); cReq();
}
function cMove(e){
  if(!C.cur) return; e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of (evs.length?evs:[e])){
    const p = cPt(ev);
    if(C.cur.erase){ cErase(p); continue; }
    const P = C.cur.p, lx = P[P.length-2], ly = P[P.length-1];
    if(Math.hypot(p[0]-lx, p[1]-ly)*C.w < 1.5) continue;
    P.push(+p[0].toFixed(4), +p[1].toFixed(4));
  }
  cReq();
}
function cUp(){
  if(!C.cur) return;
  if(C.cur.erase){ if(!C.cur.changed) C.hist.pop(); }
  else if(C.cur.p.length<4){ C.cur.p.push(C.cur.p[0]+.0005, C.cur.p[1]); }
  C.cur = null; cSave(); cReq();
}
function cErase(p){
  const r = 14/C.w; const before = C.strokes.length;
  C.strokes = C.strokes.filter(s=>{ const rr = r + s.w/2; for(let i=0;i<s.p.length;i+=2){ if(Math.hypot(s.p[i]-p[0], s.p[i+1]-p[1]) < rr) return false; } return true; });
  if(C.strokes.length!==before){ C.cur.changed = true; sfx('tick'); cReq(); }
}
function cReq(){ if(!C.raf) C.raf = requestAnimationFrame(()=>{ C.raf = 0; cDraw(); }); }
function cDraw(){
  const x = C.ctx, W = C.w; if(!x) return;
  x.clearRect(0,0,C.cv.width,C.cv.height);
  for(const s of C.strokes){
    const P = s.p; if(P.length<2) continue;
    x.save();
    x.lineCap = s.t==='hl' ? 'butt' : 'round'; x.lineJoin = 'round';
    x.strokeStyle = s.c; x.lineWidth = s.w*W;
    if(s.t==='hl'){ x.globalAlpha = .42; x.globalCompositeOperation = 'multiply'; }
    x.beginPath(); x.moveTo(P[0]*W, P[1]*W);
    if(P.length<=4) x.lineTo(P[P.length-2]*W, P[P.length-1]*W);
    else { for(let i=2;i<P.length-2;i+=2){ const mx = (P[i]+P[i+2])/2*W, my = (P[i+1]+P[i+3])/2*W; x.quadraticCurveTo(P[i]*W, P[i+1]*W, mx, my); } x.lineTo(P[P.length-2]*W, P[P.length-1]*W); }
    x.stroke(); x.restore();
  }
}
function cSave(){ S.notes[C.ui] = C.strokes; save(); }
function cUndo(){ if(!C.hist.length){ toast('Rien à annuler.'); return; } C.strokes = JSON.parse(C.hist.pop()); cSave(); cDraw(); sfx('tick'); }
function cClear(b){
  if(!C.strokes.length) return toast('La page est déjà propre.');
  if(!b.dataset.c){ b.dataset.c = '1'; b.classList.add('warn'); b.textContent = 'Sûr ?'; setTimeout(()=>{ if(b){ delete b.dataset.c; b.classList.remove('warn'); b.textContent = '🗑️'; } }, 2500); return; }
  C.hist.push(JSON.stringify(C.strokes)); C.strokes = []; cSave(); cDraw(); delete b.dataset.c; b.classList.remove('warn'); b.textContent = '🗑️'; sfx('chomp'); toast('Page effacée. (↶ pour annuler)');
}

/* ---------- VERRE BRISÉ : moteur Canvas 2D plein écran (60 i/s) ----------

   Phase 2 : 40-45 éclats irréguliers, tranche lumineuse, teinte translucide,
   reflet spéculaire qui scintille quand l'éclat pivote, gravité + rotation.
   Le canvas se vide et se masque dès que tout est sorti de l'écran. */

  src.connect(f); f.connect(g); g.connect(MUS.drum); src.start(t, Math.random()*.8); src.stop(t+dur+.02);
}
function padN(t, notes, dur){
  const c = ac();
  notes.forEach((m,i)=>{ [-6,6].forEach(det=>{ const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.value = midiF(m); o.detune.value = det + (i-1)*2;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.0075, t+.9); g.gain.setTargetAtTime(0, t+dur-.3, .4); o.connect(g); g.connect(MUS.pad); o.start(t); o.stop(t+dur+1.6); }); });
}
function musStep(step, t){
  const sd = 60/MUS.bpm/4, bar = Math.floor(step/16) % 8, s = step % 16;
  const [root, voic] = MUS_CH[bar], nextRoot = MUS_CH[(bar+1)%8][0];
  if(s===0) padN(t, [root+24, root+31, voic[voic.length-1]], sd*16);
  const comp = MUS_COMP[(bar + (bar>3?1:0)) % 4];
  for(const [cs,cd,cv] of comp){ if(cs===s){ voic.forEach((m,i)=>rhodes(t + i*.011 + Math.random()*.004, m, cv*(.88+Math.random()*.2), cd*sd)); } }
  for(const [bs,bd,bv,iv] of MUS_BASS){ if(bs===s){ const m = iv==='app' ? nextRoot + 12 + (nextRoot>root ? -1 : 1) : root + 12 + iv; bassN(t, m, bv, bd*sd*.92); } }
  const mo = MUS_MOTIF[bar]; if(mo) for(const [ms,mm,mv] of mo){ if(ms===s) rhodes(t, mm, mv, sd*3); }
  // batterie feutrée
  if(s===0 || s===7 || (s===10 && bar%2)) hitN(t, 'k', s===0 ? 1 : .6);
  if(s===4 || s===12) hitN(t, 's', s===12 ? .9 : .75);
  if(s%2===0) hitN(t, 'h', s%4===2 ? 1 : .6); else if(Math.random()<.35) hitN(t, 'h', .3);
  if(s===14 && (bar===3 || bar===7)) hitN(t, 'o', .8);
}
function musTick(){
  if(!MUS.on) return;
  const c = ac(), sd = 60/MUS.bpm/4;
  while(MUS.nextT < c.currentTime + .22){
    musStep(MUS.step, MUS.nextT + (MUS.step % 2 ? sd*.26 : 0));
    MUS.nextT += sd; MUS.step = (MUS.step + 1) % 128;
  }
}
function musLevel(){ if(!BUS.music) return; const c = ac(); BUS.music.gain.cancelScheduledValues(c.currentTime); BUS.music.gain.setTargetAtTime(MUS.on ? MUS.level*MUS.duck : 0, c.currentTime, .35); }
function musStart(){
  if(MUS.on || !AUD.on) return;
  buses(); musBuild();
  MUS.on = true; MUS.nextT = ac().currentTime + .1;
  clearInterval(MUS.timer); MUS.timer = setInterval(musTick, 25); musTick(); musLevel(); updSnd();
}
function musStop(){ MUS.on = false; clearInterval(MUS.timer); musLevel(); updSnd(); }
function musToggle(){ audioUnlock(); S.music = !MUS.on; save(); S.music ? musStart() : musStop(); }

        <div class="p-choices"><div class="bank p-bank" id="bank"></div></div></div>`;
    }
  }
  const foot = e.t==='pairs' ? `<div class="hint-foot">Touche une carte à gauche, puis sa paire à droite</div>`
    : `<button class="p-go" id="checkBtn" disabled onclick="check()">Vérifier <i>⏎</i></button>`;
  const first = !L._shown; L._shown = true;
  $('#lesson').innerHTML = `<div class="p-lesson l-body t-${e.t} ${first?'first':''}">
    ${topBar()}
    <section class="p-stage">
      <div class="p-kind ex-kind"><small class="p-kicker">${esc(lessonLabel())} · QUESTION ${n}/${L.total}</small><h2>${kindHTML(KIND[e.t])}</h2>${comboTag}</div>
      <div class="p-stage-in">${stage}</div>
      <div class="p-verdict" id="verdict"></div>
    </section>
    <section class="p-dlgzone">
      <div class="p-portrait"><i class="pf-back" aria-hidden="true"></i><i class="pf-red" aria-hidden="true"></i><div class="askm" id="askm">${mon(st,150,null,{track:true})}</div></div>
      <div class="p-dlg" id="dlg"><i class="d-w" aria-hidden="true"></i><i class="d-k" aria-hidden="true"></i><i class="d-r1" aria-hidden="true"></i><i class="d-r2" aria-hidden="true"></i>
        <div class="d-name"><b>FIDBAK</b><small id="dmood">${esc(STAGE_NAMES[st])}</small></div>
        <div class="d-txt" id="dtxt"><p class="d-line">${txt}</p></div><i class="d-next" aria-hidden="true"></i></div>
      <div class="p-col3"><div class="p-choices" id="choices">${choices}</div><div class="l-foot p-foot" id="lfoot">${foot}</div></div>
    </section></div>`;
  if(e.t==='order') drawOrder();

  if(st>=5) startKawaii(); else stopKawaii();
  trackEyes();
  qbgStep(n);
  kbRefresh(820);
}
function drawOrder(){
  const n = L.tiles.length, ends = L.cur.ends || ['Début','Fin'];
  let s = '';
  for(let k=0;k<n;k++){
    if(k) s += `<span class="ord-arr" aria-hidden="true">➜</span>`;
    const ti = L.ans[k];
    if(ti!==undefined) s += `<button class="oslot full" onclick="unplace(${k})" aria-label="Case ${k+1} : ${esc(L.tiles[ti])}"><i>${k+1}</i><span>${esc(L.tiles[ti])}</span></button>`;
    else s += `<div class="oslot ${k===L.ans.length?'next':''}"><i>${k+1}</i><span class="ph">${k===0?esc(noEmoji(ends[0])):k===n-1?esc(noEmoji(ends[1])):'…'}</span></div>`;
  }
  $('#ansLine').innerHTML = s;
  $('#bank').innerHTML = L.tiles.map((t,i)=>{ const u = L.ans.includes(i); return cw(i, `<button class="tile bub ${u?'used':''}" onclick="place(${i})" ${u?'tabindex="-1"':''}><span class="k">${String.fromCharCode(65+i)}</span><span class="t">${esc(t)}</span></button>`, u?'used':''); }).join('');
  enableCheck(L.ans.length===L.tiles.length);
}
function resolve(ok, sol, opt){
  const dead = !ok && L.hearts===1;
  resolveCore(ok, sol, opt);

}
function p5AfterResolve(ok, dead){
  const foot = $('#lfoot'); if(!foot || !L) return;

  foot.className = 'l-foot p-foot ' + (ok?'good':'bad');

}
function next(){
  if(!L || L.state!=='done' || L._sliding) return;
  if(L.hearts<=0) return ko();
  if(!L.queue.length) return finish();

}

  const lesson = LESSONS.find(l=>l.id===L.id);

  const bonus = (isFinal ? 30 : isPractice ? 0 : 10) + (L.mistakes===0 ? 5 : 0) + Math.floor(L.maxCombo/5)*3;
  L.gotItems.push(...addXp(bonus));
  const bondGain = isFinal ? 10 + (stars===3?5:0) : isPractice ? 2 : 3 + (stars===3?3:0);
  addBond(bondGain);
  if(!isPractice) S.done[L.id] = Math.max(S.done[L.id]||0, stars);
  bumpStreak(); save();
  if(lesson && !unitWasDone && worldDone(lesson.unit)){
    const nw = lesson.unit + 1;
    if(nw<WORLDS.length && worldUnlocked(nw)){ S.world = lesson.unit; afterHome.push(()=>{ toast(`Nouveau monde débloqué : ${WORLDS[nw].name} !`, 'good'); setTimeout(()=>travel(nw), 900); }); }
  }
  const acc = Math.round(100*L.total/(L.total+L.mistakes));
  const xpGained = S.xp - L.xp0;
  const li = lvlInfo();
  const lines = {
    3:["SANS-FAUTE. Je… je t’aime bien en fait ♡","Zéro faute… laisse-moi tranquille, je suis ému (；▽；) ♡","Perfection. Shannon, Wiener et moi on t’applaudit ✨"],
    2:["Correct. Pas parfait. Je reste un monstre, mais un monstre poli.","Pas mal. Quelques bruits sur la ligne, mais le message est passé."],
    1:["T’as fini. Par miracle. Ça compte pas vraiment comme une victoire. HAHA.","Terminé… dans la douleur. Refais-la, je t’attends avec mes crocs."]
  };
  const face = stars===3 ? mon(5,200,'happy5') : stars===2 ? mon(3,200,null,{track:true}) : mon(0,200,'mock');
  const title = isFinal ? (stars===3?'Boss vaincu !!':'Contrôle terminé') : (isPractice?'Erreurs revues':'Leçon terminée');
  const items = L.gotItems.concat(ITEMS.filter(i=>i.bond && S.bond>=i.bond && L.bond0<i.bond));
  $('#end').innerHTML = `<div class="p-end end-in">
    <div class="pe-left"><i class="pe-slash" aria-hidden="true"></i><div class="endm pe-port">${face}</div>
      <div class="end-stars pe-stars">${[1,2,3].map(i=>`<span class="${i<=stars?'on':''}" style="animation-delay:${.35+i*.16}s">★</span>`).join('')}</div></div>
    <div class="pe-right">
      <small class="p-kicker">${isFinal?'CONTRÔLE BLANC':isPractice?'RÉVISION':esc(lessonLabel())} · RÉSULTATS</small>
      <h1 class="pe-title">${esc(title)}</h1>
      <div class="p-say mini pe-say"><div class="say-name">FIDBAK</div><p>${esc(rnd(lines[stars]))}</p></div>
      <div class="cards p-cards">
        <div class="card"><small>XP GAGNÉS</small><b>⚡ ${xpGained}</b></div>
        <div class="card"><small>PRÉCISION</small><b>🎯 ${acc}%</b></div>
        <div class="card red"><small>SÉRIE MAX</small><b>🔥 ${L.maxCombo}</b></div>
      </div>
      <div class="end-prog p-card">
        <div class="meter"><span class="lab">XP</span><div class="mbar xpb"><i id="endxp" style="width:0%"></i></div><small>Niv. ${li.l}${li.l>L.lv0?' ⬆️':''}${li.nxt?` · ${S.xp}/${li.nxt}`:' · MAX'}</small></div>
        <div class="meter"><span class="lab">LIEN</span><div class="mbar bond"><i id="endbond" style="width:${L.bond0}%"></i></div><small>${esc(bondTitle(S.bond))} · +${bondGain} ❤️</small></div>
      </div>
      ${items.length ? `<div class="gift">🎁 Débloqué : ${items.map(i=>`${i.ico} ${esc(i.name)}`).join(' · ')}</div>` : ''}
      <div class="p-actions">
        <button class="btn" onclick="show('home')">Continuer</button>
        ${items.length ? `<button class="btn good" onclick="show('home');setTimeout(()=>openWardrobe(),300)">🎨 Habiller Fidbak</button>` : ''}
        ${stars<3 ? `<button class="btn ghost" onclick="startLesson('${L.id}')">Refaire pour 3 étoiles</button>` : ''}
      </div>
    </div></div>`;
  show('end'); confetti(stars===3); sfx('win');
  setTimeout(()=>{ const x = $('#endxp'); if(x) x.style.width = li.pct+'%'; const b = $('#endbond'); if(b) b.style.width = S.bond+'%'; }, 500);
  if(stars===3) setTimeout(perfectShow, 1100);
}

/* ---------- NAVIGATION CLAVIER ----------
   Flèches, ZQSD (AZERTY) ou WASD (QWERTY) : déplacer la sélection.
   Entrée / Espace : valider. Échap : revenir en arrière.
   Souris et clavier partagent UN SEUL curseur (.kb) : même rendu, même son,
   jamais deux éléments en surbrillance. */
const KB = {el:null, mode:'mouse', t:0};
const NAVSEL = 'button:not(:disabled), .c-toc a, input, .prop';
function kbScopes(){
  if(document.querySelector('.cine, .shatter-v7')) return [];
  const m = $('#modal'); if(!m.hidden) return [m, $('#audioPanel')];
  const scr = document.body.dataset.screen || 'home';
  return [$('#'+scr), $('#audioPanel')];
}
function kbVisible(el){
  if(!el || !el.isConnected || el.closest('[hidden]') || el.closest('.fog')) return false;
  if(el.matches('.used,[tabindex="-1"]') || el.closest('.cw.used')) return false;
  const r = el.getBoundingClientRect(); if(r.width < 4 || r.height < 4) return false;
  const cs = getComputedStyle(el); return cs.visibility!=='hidden' && cs.display!=='none';
}
function kbItems(){ const out = []; for(const s of kbScopes()){ if(!s) continue; s.querySelectorAll(NAVSEL).forEach(el=>{ if(kbVisible(el)) out.push(el); }); } return out; }
function kbMark(el, on){ if(!el) return; el.classList.toggle('kb', on); const w = el.closest('.cw, .wnode'); if(w) w.classList.toggle('kb', on); }
function setCursor(el, fromKey){
  if(KB.el === el) return;
  if(KB.el) kbMark(KB.el, false);
  KB.el = el || null;
  if(!el) return;
  kbMark(el, true);
  sfx('hover');
  if(fromKey){
    if(!(el instanceof SVGElement)) try{ el.focus({preventScroll:true}); }catch(e){}
    const r = el.getBoundingClientRect();
    if(r.top < 90 || r.bottom > innerHeight - 30) el.scrollIntoView({block:'center', behavior:'smooth'});
  }
}
/* souris → même curseur */
document.addEventListener('pointerover', e=>{
  if(e.pointerType==='touch') return;
  const el = e.target.closest(NAVSEL); if(!el || el.disabled) return;
  if(!kbScopes().some(s=>s && s.contains(el))) return;
  KB.mode = 'mouse'; setCursor(el, false);
});
document.addEventListener('pointerout', e=>{
  if(KB.mode!=='mouse' || !KB.el) return;
  if(e.target.closest(NAVSEL)===KB.el && !KB.el.contains(e.relatedTarget)) setCursor(null);
});
function kbC(el){ const r = el.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2}; }
function kbDefault(items){
  const pick = sel => items.find(el=>el.matches(sel));
  if(!$('#modal').hidden) return pick('#modal .btn') || items[0];
  const scr = document.body.dataset.screen;
  if(scr==='lesson' && L){
    if(L.state==='done') return pick('#nextBtn') || items[0];
    return pick('.p-choices .bub:not(.used), .p-pairs .pc:not(.matched), #typeIn') || items[0];
  }
  if(scr==='home') return pick('.wnode.current .node') || pick('.node:not(.locked)') || items[0];
  if(scr==='cours') return pick('.c-toc a') || items[0];
  if(scr==='end') return pick('#end .btn') || items[0];
  return items[0];
}
function kbMove(dir){
  const items = kbItems(); if(!items.length) return;
  const cur = KB.el && items.includes(KB.el) ? KB.el : null;
  if(!cur){ setCursor(kbDefault(items), true); return; }
  const c = kbC(cur); let best = null, bs = Infinity;
  for(const el of items){
    if(el===cur) continue;
    const p = kbC(el), dx = p.x - c.x, dy = p.y - c.y;
    const main = dir==='left' ? -dx : dir==='right' ? dx : dir==='up' ? -dy : dy;
    const cross = (dir==='left' || dir==='right') ? Math.abs(dy) : Math.abs(dx);
    if(main < 6) continue;
    const s = main + cross*2.4; if(s < bs){ bs = s; best = el; }
  }
  if(best) setCursor(best, true);
}
function kbRefresh(ms){
  clearTimeout(KB.t);
  KB.t = setTimeout(()=>{
    if(KB.el && !KB.el.isConnected){ KB.el = null; }
    if(KB.mode!=='key') return;
    if(KB.el && kbVisible(KB.el) && kbScopes().some(s=>s && s.contains(KB.el))) return;
    const it = kbItems(); if(it.length) setCursor(kbDefault(it), true);
  }, ms || 0);
}
function kbAfter(){
  if(KB.mode!=='key') return;
  const scr = document.body.dataset.screen;
  if($('#modal').hidden && scr==='lesson' && L){
    if(L.state==='ask'){
      if(L.cur.t==='order' && L.ans.length < L.tiles.length){ const nx = document.querySelector('#bank .bub:not(.used)'); if(nx) return setCursor(nx, true); }
      const cb = $('#checkBtn'); if(cb && !cb.disabled && L.cur.t!=='pairs') return setCursor(cb, true);
    } else if(L.state==='done'){ const nb = $('#nextBtn'); if(nb) return setCursor(nb, true); }
  }
  kbRefresh(60);
}
function kbActivate(el){
  hitFromEl(el);
  if(el.tagName==='INPUT'){ if(el.type==='checkbox') el.click(); else el.focus(); return; }
  if(el instanceof SVGElement) el.dispatchEvent(new MouseEvent('click', {bubbles:true}));
  else el.click();
  setTimeout(kbAfter, 50);
}
function kbBack(){
  if(!$('#modal').hidden) return closeModal();
  const scr = document.body.dataset.screen;
  if(scr==='lesson' && L) return quitAsk();
  if(scr==='cours') return closeCours();
  if(scr==='end') return show('home');
}
const KB_DIR = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
const KB_LET = {z:'up', w:'up', s:'down', q:'left', a:'left', d:'right'};
document.addEventListener('keydown', e=>{
  lastAct = Date.now();
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, t = e.target;
  const typing = !!(t && t.matches && t.matches('input.type-in, input[type=text], textarea'));
  if(document.querySelector('.cine')){ const sk = document.querySelector('.cine .cine-skip'); if(sk && (k==='Escape' || k==='Enter' || k===' ')){ e.preventDefault(); sk.click(); } return; }
  if(document.querySelector('.shatter-v7')){ if(k===' ' || k==='Enter') e.preventDefault(); return; }
  let dir = KB_DIR[k]; if(!dir && !typing && k.length===1) dir = KB_LET[k.toLowerCase()];
  if(dir){
    if(typing && (dir==='left' || dir==='right')) return;
    if(KB.el && KB.el.type==='range' && document.activeElement===KB.el && (dir==='left' || dir==='right')) return;
    e.preventDefault(); KB.mode = 'key'; kbMove(dir); return;
  }
  if(k==='Escape'){ e.preventDefault(); KB.mode = 'key'; kbBack(); return; }
  const inLesson = !$('#lesson').hidden && L && $('#modal').hidden;
  if(k==='Enter' || (k===' ' && !typing)){
    e.preventDefault();
    const prev = KB.mode; KB.mode = 'key';
    const cur = prev==='key' && KB.el && kbVisible(KB.el) ? KB.el : null;   // un survol souris ne détourne pas Entrée
    if(inLesson){
      if(L.state==='done' && (!cur || cur.closest('.p-dlgzone, .p-stage') || cur.id==='nextBtn')){ const nb = $('#nextBtn'); if(nb) hitFromEl(nb); next(); return; }
      if(L.state==='ask' && (typing || (cur && cur.classList.contains('sel')))){ const b = $('#checkBtn'); if(b && !b.disabled){ hitFromEl(b); check(); setTimeout(kbAfter, 50); } return; }
    }
    if(typing) return;
    if(cur){ kbActivate(cur); return; }
    if(inLesson && L.state==='ask'){ const b = $('#checkBtn'); if(b && !b.disabled){ hitFromEl(b); check(); setTimeout(kbAfter, 50); return; } }
    const it = kbItems(); if(it.length) setCursor(kbDefault(it), true);
    return;
  }
  if(inLesson && L.state==='ask' && /^[1-6]$/.test(k) && !typing){
    const i = +k - 1, tt = L.cur.t;
    if(((tt==='mcq' || tt==='fill') && i < L.opts.length) || (tt==='tf' && i < 2)){ e.preventDefault(); KB.mode = 'key'; const o = $('#o'+i); hitFromEl(o); pick(i); setCursor(o, true); setTimeout(kbAfter, 50); }
  }
});
