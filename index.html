:root{
  --bg:#0F0B0C; --s1:#171213; --s2:#201819; --s3:#2C2225; --line:#33272A; --line2:#4A383D;
  --text:#F7EEF0; --muted:#A8949A; --dim:#6F5C61;
  --red:#FF3B4E; --red-d:#A8172A;
  --sel:#FF8A3D; --sel-l:rgba(255,138,61,.13);
  --pink:#FF6FB1; --pink-d:#B03A75; --pink-l:rgba(255,111,177,.14);
  --bad:#FF2D45; --bad-d:#8E0F20; --bad-l:rgba(255,45,69,.15);
  --gold:#FFC23D; --gold-d:#A87800;
  --gut:clamp(14px,3.5vw,28px);
  --bgimg:radial-gradient(1100px 520px at 50% -180px,rgba(255,59,78,.16),transparent 70%);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:'Nunito',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);font-size:16px;background:var(--bgimg),var(--bg);background-attachment:fixed;overflow-x:hidden}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:var(--red);color:#fff}

/* ---------- boutons ---------- */
.btn{display:block;border:none;border-radius:16px;padding:15px 22px;font-weight:900;font-size:16px;letter-spacing:.07em;text-transform:uppercase;background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-d);transition:transform .06s,box-shadow .06s,filter .15s}
.btn.kb{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-d)}
.btn:disabled{background:var(--s3);color:var(--dim);box-shadow:0 5px 0 #1B1415;cursor:default;transform:none;filter:none}
.btn.wide{width:100%}
.btn.good{background:var(--pink);box-shadow:0 5px 0 var(--pink-d);color:#2A0718}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line2);box-shadow:0 4px 0 var(--line2)}
.btn.ghost.danger{color:var(--bad)}
.btn + .btn{margin-top:12px}

/* ---------- accueil ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(15,11,12,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px var(--gut)}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:clamp(22px,3vw,28px);color:var(--red);letter-spacing:-.03em}
.logo .mon{width:38px;height:auto}
.logo small{display:none;font-size:13px;color:var(--muted);font-weight:800;letter-spacing:0;margin-left:6px}
.stats{display:flex;align-items:center;gap:clamp(10px,2vw,18px);font-weight:900}
.stat{display:flex;align-items:center;gap:4px;font-size:clamp(15px,2vw,18px)}
.stat.fire{color:#FF8A3D}.stat.xp{color:var(--gold)}.stat.lv{color:var(--pink)}
.icon-btn{background:none;border:none;font-size:22px;padding:4px;line-height:1}
.home-grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);padding-bottom:40px}
.side{padding:16px var(--gut) 0;display:flex;flex-direction:column;gap:14px;min-width:0}
.path-col{min-width:0}
.box{background:var(--s1);border:2px solid var(--line);border-radius:20px;padding:16px}
.box h4{margin:0 0 4px;font-size:16px;font-weight:900}
.hero{display:flex;align-items:center;gap:12px}
.hero-txt{flex:1;min-width:0}
.hero-txt b{display:block;font-size:clamp(17px,2.2vw,20px);font-weight:900}
.hero-txt span{color:var(--muted);font-weight:700;font-size:14px}
.bar{height:14px;background:var(--s3);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#FF8A3D);border-radius:99px}
.practice{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px solid #6A1C28;border-bottom-width:5px;background:linear-gradient(180deg,#2B1013,#200C0E);color:#FF7A88;border-radius:16px;padding:13px;font-weight:900;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.practice:active{transform:translateY(3px);border-bottom-width:2px}
.legend p{margin:0 0 10px;color:var(--muted);font-weight:700;font-size:13px}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;text-align:center}
.stages svg{width:100%;height:auto;max-width:60px;margin:0 auto}
.stages span{display:block;font-size:10.5px;font-weight:900;color:var(--muted);margin-top:2px}

/* tanière */
.room-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.room-head b{font-size:16px;font-weight:900}
.room-head span{font-size:12px;font-weight:900;color:#1A0B0D;background:var(--pink);padding:3px 9px;border-radius:99px;white-space:nowrap}
.stage{position:relative;height:220px;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:radial-gradient(260px 150px at 50% 100%,rgba(255,59,78,.2),transparent 70%),linear-gradient(#1C1416,#120D0E)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#241A1C 0 38px,#2B1F22 38px 76px);border-top:2px solid var(--line2)}
.stage .poster{position:absolute;top:58px;font-size:22px;opacity:.5}
.buddy{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);transition-property:left;transition-timing-function:ease-in-out;z-index:2}
#bwrap{width:128px;cursor:pointer;touch-action:manipulation}
#bwrap .mon{width:100%;height:auto}
.flip{transition:transform .25s}.flip.left{transform:scaleX(-1)}
#bwrap.walking{animation:walk .32s ease-in-out infinite alternate}
#bwrap.jump{animation:bjump .65s ease}
#bwrap.spin{animation:bspin .75s ease}
#bwrap.dance{animation:dance .4s ease-in-out 5 alternate}
#bwrap.bite{animation:bite .5s ease}
.say{position:absolute;top:10px;left:50%;transform:translateX(-50%) translateY(-6px);width:calc(100% - 24px);max-width:340px;background:var(--s2);border:2px solid var(--line2);border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px;line-height:1.3;text-align:center;opacity:0;transition:.2s;z-index:3;pointer-events:none}
.say.on{opacity:1;transform:translateX(-50%)}
.meters{display:grid;gap:9px;margin-top:12px}
.meter{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px}
.meter .lab{width:22px;text-align:center}
.mbar{flex:1;height:12px;background:var(--s3);border-radius:99px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.3,1.2,.6,1)}
.mbar.bond i{background:linear-gradient(90deg,#FF3B4E,#FF6FB1)}
.mbar.xpb i{background:linear-gradient(90deg,#FFC23D,#FF8A3D)}
.meter small{color:var(--muted);font-weight:800;font-size:12px;white-space:nowrap}
.next-step{color:var(--muted);font-weight:700;font-size:12.5px;margin-top:2px}
.room-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rbtn{border:2px solid var(--line2);border-bottom-width:4px;background:var(--s2);border-radius:14px;padding:11px 8px;font-weight:900;font-size:14px;position:relative}
.rbtn:active{transform:translateY(2px);border-bottom-width:2px}
.rbtn .dot{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--red);border:3px solid var(--s1)}
#mini{position:fixed;right:10px;bottom:10px;z-index:30;width:84px;cursor:pointer;display:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
#mini.on{display:block;animation:pop .3s}
#mini .mon{width:100%;height:auto}
#mini .msay{position:absolute;right:78px;bottom:30px;width:200px;background:var(--s2);border:2px solid var(--line2);border-radius:14px;padding:8px 10px;font-weight:800;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
#mini .msay.on{opacity:1}

.unit-head{margin:24px var(--gut) 0;border-radius:18px;padding:16px 14px 16px 20px;color:#fff;background:var(--c);box-shadow:0 5px 0 var(--cd);display:flex;align-items:center;justify-content:space-between;gap:12px}
.unit-head small{font-weight:900;opacity:.85;letter-spacing:.08em;font-size:12px}
.unit-head h2{margin:2px 0;font-size:clamp(18px,2.4vw,22px);font-weight:900;line-height:1.15}
.unit-head p{margin:0;font-weight:700;opacity:.92;font-size:14px}
.guide-btn{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid rgba(255,255,255,.45);border-bottom-width:4px;background:rgba(0,0,0,.16);color:#fff;border-radius:14px;padding:8px 10px;font-weight:900;font-size:20px}
.guide-btn span{font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;padding:58px 0 34px;min-height:240px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center;width:136px}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:none;background:var(--c);box-shadow:0 8px 0 var(--cd);color:#fff;font-size:30px;font-weight:900;display:grid;place-items:center;transition:transform .08s,box-shadow .08s,filter .15s}
.node.kb{filter:brightness(1.1)}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--cd)}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-d);color:#3A2600}
.node.done:active{box-shadow:0 2px 0 var(--gold-d)}
.node.locked{background:var(--s3);box-shadow:0 8px 0 #1A1314;color:var(--dim);font-size:24px}
.nwrap.current::before{content:'';position:absolute;top:-11px;width:98px;height:98px;border-radius:50%;border:7px solid var(--c);opacity:.3;animation:ring 1.8s ease-in-out infinite}
.start-bubble{position:absolute;top:-52px;background:var(--s2);color:var(--c);border:2px solid var(--line2);font-weight:900;font-size:14px;letter-spacing:.07em;padding:8px 12px;border-radius:12px;white-space:nowrap;animation:float 1.6s ease-in-out infinite;z-index:2}
.start-bubble::after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--s2);border-right:2px solid var(--line2);border-bottom:2px solid var(--line2);transform:translateX(-50%) rotate(45deg)}
.nlabel{margin-top:14px;font-size:12.5px;font-weight:800;color:var(--muted);text-align:center;line-height:1.2}
.nwrap.current .nlabel{margin-top:24px;color:var(--text)}
.stars{color:var(--gold);font-size:14px;letter-spacing:2px;margin-top:2px}
.final .unit-head{background:linear-gradient(135deg,#7E0F22,#FF3B4E 55%,#FF8A3D)}
.foot-note{text-align:center;color:var(--dim);font-weight:700;font-size:13px;padding:10px 24px 30px}

@media (min-width:700px){
  .logo small{display:inline}
  .node{width:86px;height:78px;font-size:34px}

body.quake{animation:quake .5s}
body.quake-s{animation:quake .25s}

.shard::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%,rgba(255,255,255,.05));pointer-events:none}

/* ---------- monstre ---------- */
.mon{overflow:visible;display:block}
.mon .pup{transform:translate(var(--px,0px),var(--py,0px));transition:transform .12s linear}
.mon.s0,.mon.s1{animation:grr 2.2s ease-in-out infinite;transform-origin:50% 95%}
.mon.s2,.mon.s3{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 95%}
.mon.s4{animation:wiggle 1.6s ease-in-out infinite;transform-origin:50% 95%}
.mon.s5{animation:hop .55s ease 2,sway 2.4s ease-in-out 1.1s infinite;transform-origin:50% 100%}
.mon.rage{animation:rage .5s ease,grr 1s ease-in-out .5s infinite;transform-origin:50% 95%}
.mon.mock,.mon.laugh{animation:laugh .22s ease-in-out infinite alternate;transform-origin:50% 100%}
.mon.kiss{animation:sway 1.4s ease-in-out infinite;transform-origin:50% 100%}
.mon.sleep{animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
.mon.tf{animation:transform .8s ease!important}
.mon .zz{animation:zz 2.4s ease-in-out infinite}

@keyframes grr{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(1px) scaleY(.97)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.08,.9)}}
@keyframes rage{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px) rotate(-5deg)}35%{transform:translateX(8px) rotate(5deg)}55%{transform:translateX(-6px)}75%{transform:translateX(5px)}}
@keyframes laugh{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-4px) rotate(3deg)}}
@keyframes transform{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.28) rotate(-14deg);filter:brightness(1.9) saturate(1.4)}65%{transform:scale(.9) rotate(9deg)}100%{transform:scale(1) rotate(0)}}
@keyframes zz{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes walk{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-6px) rotate(5deg)}}
@keyframes bjump{0%,100%{transform:translateY(0)}40%{transform:translateY(-48px) scale(.95,1.05)}70%{transform:translateY(0) scale(1.08,.92)}}
@keyframes bspin{to{transform:rotate(360deg)}}
@keyframes dance{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-10px)}}
@keyframes bite{30%{transform:scale(1.28) translateY(-10px)}60%{transform:scale(.95)}}
@keyframes nom{40%{transform:scale(1.12,.9)}}
@keyframes ring{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.06);opacity:.15}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes quake{0%,100%{transform:translate(0,0)}10%{transform:translate(-12px,6px)}25%{transform:translate(10px,-8px)}40%{transform:translate(-8px,-4px)}55%{transform:translate(7px,6px)}70%{transform:translate(-4px,3px)}85%{transform:translate(3px,-2px)}}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes ftxt{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-75%) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% - 100px)) scale(1)}}
@keyframes wf{0%{opacity:.95}100%{opacity:0}}
@keyframes kissIn{0%{transform:translateY(70vh) scale(.4)}30%{transform:translateY(0) scale(1)}55%{transform:translateY(0) scale(1.05)}68%{transform:translateY(0) scale(2.7);filter:blur(1.5px)}74%{transform:scale(2.8);opacity:1}100%{transform:translateY(-12vh) scale(.5);opacity:0}}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.7);opacity:0}to{transform:translate(-50%,-50%) rotate(var(--r)) scale(1);opacity:1}}
@keyframes lipsOut{to{opacity:0;transform:translate(-50%,-44%) rotate(var(--r)) scale(.97)}}
@keyframes mwah{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%{opacity:1;transform:translateX(-50%) scale(1.15)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
@keyframes koIn{to{transform:translateX(-50%) translateY(0)}}
@keyframes windup{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(6%) rotate(-14deg) scale(.92)}}
@keyframes punch{to{transform:translate(-50%,-60%) scale(7.5);top:44%}}
@media (prefers-reduced-motion:reduce){.mon,.mon *,#bwrap{animation:none!important}}

/* ================= v4 : mondes ================= */
.world-col{min-width:0}
.wnav{display:flex;align-items:center;gap:8px;margin:16px var(--gut) 10px}
.wnav .arrow{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--line2);border-bottom-width:4px;background:var(--s2);font-size:18px;font-weight:900;color:var(--text)}
.wnav .arrow:disabled{opacity:.3;cursor:default}
.wnav .arrow:not(:disabled):active{transform:translateY(2px);border-bottom-width:2px}
.wtitle{flex:1;min-width:0;text-align:center}
.wtitle small{display:block;font-weight:900;font-size:11px;letter-spacing:.12em;color:var(--wc)}
.wtitle b{display:block;font-size:clamp(16px,2.6vw,24px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene{position:relative;margin:0 var(--gut);aspect-ratio:5/4;border-radius:22px;overflow:hidden;border:2px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;background:#000;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.scene .layer{position:absolute;inset:0;will-change:transform}
.scene-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wpath{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.prop{cursor:pointer;transition:filter .2s}
.prop.kb{filter:brightness(1.25) drop-shadow(0 0 4px rgba(255,255,255,.55))}
.prop.ping{animation:ping .8s ease}
.pmark{position:absolute;z-index:2;transform:translate(-50%,-100%);font-weight:900;font-size:13px;color:#1A0B0D;background:var(--gold);border-radius:99px;width:24px;height:24px;display:grid;place-items:center;pointer-events:none;animation:float 1.4s ease-in-out infinite;box-shadow:0 3px 0 #7A5600,0 0 14px rgba(255,194,61,.5)}
.pmark.seen{background:rgba(255,255,255,.22);color:#fff;box-shadow:none;animation:none;width:16px;height:16px;font-size:9px}
.wnode{position:absolute;z-index:3;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:default}
.wnode .node{width:clamp(46px,10.5vw,74px);height:clamp(42px,9.6vw,68px);font-size:clamp(19px,3.8vw,28px)}
.wnode .node.boss{width:clamp(56px,13vw,92px);height:clamp(52px,12vw,84px);font-size:clamp(24px,5vw,38px)}
.wnode.current::before{--rs:calc(clamp(46px,10.5vw,74px) + 24px);content:'';position:absolute;top:50%;left:50%;width:var(--rs);height:var(--rs);margin:calc(var(--rs) / -2 - 3px) 0 0 calc(var(--rs) / -2);box-sizing:border-box;border-radius:50%;border:6px solid var(--wc);opacity:.35;animation:ring 1.8s ease-in-out infinite;pointer-events:none}
.wnode .start-bubble{top:auto;bottom:calc(100% + 10px);font-size:11.5px;padding:5px 9px;color:var(--wc)}
.wnode .nlabel{position:absolute;top:calc(100% + 4px);margin:0;background:rgba(10,6,8,.78);color:#fff;padding:3px 8px;border-radius:99px;font-size:11px;white-space:nowrap;display:none}
.wnode .stars{position:absolute;top:calc(100% + 2px);font-size:11px;text-shadow:0 1px 2px #000}
.wnode.kb .nlabel{display:block}
.wnode.kb .stars{display:none}
@media (min-width:700px){ .wnode .nlabel{display:block;top:calc(100% + 6px)} .wnode .stars{top:calc(100% + 26px)} }
.wnode .node{--c:var(--wc);--cd:color-mix(in srgb, var(--wc) 55%, #000)}
.wbuddy{position:absolute;z-index:2;top:99%;transform:translate(-50%,-100%);width:clamp(74px,21%,170px);transition-property:left;transition-timing-function:ease-in-out;pointer-events:none}
.wbuddy .shadow{position:absolute;left:14%;right:14%;bottom:-3%;height:9%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%);z-index:-1}
.wbuddy .bw{pointer-events:auto;cursor:pointer}
.wbuddy .mon{width:100%;height:auto}
.bw.walking{animation:walk .3s ease-in-out infinite alternate}
.bw.run{animation:run .2s ease-in-out infinite alternate}
.bw.jump{animation:bjump .65s ease}
.bw.spin{animation:bspin .75s ease}
.bw.dance{animation:dance .4s ease-in-out 5 alternate}
.bw.bite{animation:bite .5s ease}
.wsay{position:relative;margin:10px var(--gut) 0;display:flex;gap:10px;align-items:center;background:var(--s1);border:2px solid var(--line2);border-radius:16px;padding:8px 14px 8px 8px;min-height:62px;font-weight:800;font-size:clamp(13px,1.8vw,15px);line-height:1.38}
.wsay::before{content:'';position:absolute;left:calc(var(--bx,50%) - 9px);top:-9px;width:14px;height:14px;background:var(--s1);border-left:2px solid var(--line2);border-top:2px solid var(--line2);transform:rotate(45deg);transition:left .4s}
.wsay .who{flex:none;width:44px}.wsay .who .mon{width:100%;height:auto}
.wsay .txt{flex:1;min-width:0}
.wsay .txt.pop{animation:sayPop .28s ease}
@keyframes sayPop{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.wsay b{color:var(--gold)}
.wsay i{color:var(--muted);font-style:normal;font-size:.92em}
.fog{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(8,5,6,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-align:center}
.fog b{display:block;font-size:20px;font-weight:900}
.fog span{color:var(--muted);font-weight:700}
.travel-banner{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
.travel-banner div{background:rgba(10,6,8,.82);border:2px solid var(--wc);border-radius:18px;padding:12px 22px;text-align:center;animation:pop .35s .25s backwards}
.travel-banner small{display:block;font-weight:900;letter-spacing:.12em;font-size:11px;color:var(--wc)}
.travel-banner b{font-size:clamp(18px,3vw,26px);font-weight:900}
.wstrip{display:flex;gap:clamp(4px,1vw,6px);justify-content:center;margin:12px var(--gut) 0;flex-wrap:wrap}
.wdot{border:2px solid var(--line2);border-bottom-width:4px;background:var(--s2);border-radius:14px;padding:clamp(4px,1vw,6px) clamp(6px,1.6vw,10px);font-weight:900;font-size:clamp(12px,1.8vw,14px);display:flex;align-items:center;gap:5px;color:var(--text)}
.wdot .wn{font-size:11px;color:var(--muted)}
.wdot.on{border-color:var(--wc);background:color-mix(in srgb, var(--wc) 16%, var(--s2))}
.wdot.done .wn::after{content:' ✔';color:var(--gold)}
.wdot.locked{opacity:.45}
.wdot:active{transform:translateY(2px);border-bottom-width:2px}
.fid-top{display:flex;align-items:center;gap:12px}
.fid-top .mw{width:70px;flex:none}.fid-top .mon{width:100%;height:auto}
.fid-t b{font-size:18px;font-weight:900}
.fid-t small{display:block;color:var(--muted);font-weight:800;font-size:12.5px;margin-top:3px}
.pill{font-size:11.5px;font-weight:900;color:#1A0B0D;background:var(--pink);padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:2px}
@media (min-width:980px){
  .home-grid{grid-template-columns:minmax(0,1fr) 370px}
  .wnav,.scene,.wstrip,.wsay{margin-left:0;margin-right:0}
  .wnav{margin-top:0}
}
/* animations des décors */
.tw{animation:twinkle 2.4s ease-in-out infinite alternate}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift text{animation:drift 7s ease-in-out infinite alternate}
.wv{animation:wave 1.8s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.ring{animation:ringw 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.neon{animation:neon 3s ease-in-out infinite}
.flick{animation:flick .3s steps(2) infinite}
.sig{stroke-dasharray:6 3;animation:sig 1s linear infinite}
.sweep{animation:sweep 3s linear infinite;transform-box:view-box;transform-origin:312px 138px}
.blink{animation:blink 1s steps(2) infinite}
.spark{animation:blink .6s steps(2) infinite}
.shimmer{animation:twinkle 1.6s ease-in-out infinite alternate}
.lava{animation:lava 2.2s ease-in-out infinite alternate}
.smoke{animation:smoke 6s ease-in-out infinite alternate}
.ember circle{animation:ember 6s linear infinite}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(14px,-10px)}}
@keyframes wave{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@keyframes ringw{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(4)}}
@keyframes neon{0%,100%{opacity:1}46%{opacity:1}48%{opacity:.4}50%{opacity:1}52%{opacity:.5}54%{opacity:1}}
@keyframes flick{to{opacity:0}}
@keyframes sig{to{stroke-dashoffset:-18}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes lava{from{opacity:.65}to{opacity:1}}
@keyframes smoke{from{transform:translate(0,0)}to{transform:translate(8px,-12px)}}
@keyframes ember{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-200px);opacity:0}}
@keyframes ping{0%,100%{filter:none}35%{filter:brightness(2) drop-shadow(0 0 8px #fff)}}
@keyframes run{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-9px) rotate(7deg)}}

/* chibi */
.mon.chib.s5{animation:chibiBob 1.2s ease-in-out infinite;transform-origin:50% 100%}
.mon.happy5{animation:hop .5s ease 3;transform-origin:50% 100%}
.mon.kiss{animation:sway 1.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes chibiBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.97,1.03)}}
.mon .bubble-n{animation:snot 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 30%}
@keyframes snot{0%,100%{transform:scale(.55)}50%{transform:scale(1.15)}}

/* ================= v4 : K.O. manga ================= */
#ko{position:fixed;inset:0;z-index:80;overflow:hidden;background:rgba(0,0,0,0);transition:background .3s}
#ko.paper{background:#F3EFE7}
#ko .speed,#ko .speedin{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s}
#ko.paper .speed{opacity:1;animation:spd .14s steps(2) infinite}
#ko .speedin{opacity:1;animation:spd .1s steps(2) infinite}
#ko .tone{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.42) 1.1px,transparent 1.5px);background-size:7px 7px;-webkit-mask-image:radial-gradient(circle at 50% 55%,transparent 32%,#000 78%);mask-image:radial-gradient(circle at 50% 55%,transparent 32%,#000 78%);opacity:0;transition:opacity .4s}
#ko.paper .tone{opacity:1}
.sfx{position:absolute;z-index:3;font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Noto Sans JP','Noto Sans CJK JP','Meiryo',sans-serif;font-weight:900;font-size:clamp(46px,11vw,120px);color:#0A0A0A;-webkit-text-stroke:4px #fff;paint-order:stroke fill;letter-spacing:-.06em;transform:rotate(var(--r));animation:sfxIn .45s cubic-bezier(.2,1.6,.4,1) backwards;line-height:1}
.sfx.small{font-size:clamp(30px,7vw,72px)}
.ko-m{position:absolute;z-index:2;left:50%;bottom:-4vh;width:min(84vw,460px);transform:translateX(-50%) translateY(110%);animation:koIn .6s cubic-bezier(.2,1.25,.5,1) .1s forwards}
.ko-m .mon{width:100%;height:auto;filter:drop-shadow(6px 6px 0 #000)}
#ko .ko-m.windup{animation:windup .4s ease forwards}
.balloon{position:absolute;z-index:4;top:7%;left:50%;transform:translateX(-50%);max-width:88%;background:#fff;color:#0A0A0A;border:4px solid #0A0A0A;border-radius:50%/42%;padding:clamp(14px,3vw,24px) clamp(22px,5vw,40px);font-weight:900;font-size:clamp(20px,4.6vw,40px);text-align:center;animation:pop .3s;box-shadow:6px 6px 0 #0A0A0A;letter-spacing:.01em}
.balloon.low{top:auto;bottom:8%;font-size:clamp(16px,3.6vw,30px)}
.panel{position:absolute;z-index:5;left:-3%;right:-3%;top:31%;height:30%;background:#F3EFE7;border-top:9px solid #0A0A0A;border-bottom:9px solid #0A0A0A;overflow:hidden;transform:rotate(-3deg);animation:panelIn .22s ease-out;box-shadow:0 0 0 6px #fff}
.panel .pz{position:absolute;left:50%;top:50%;width:max(130vw,900px);transform:translate(-50%,-37%)}
.panel .pz .mon{width:100%;height:auto}
.panel-cap{position:absolute;right:6%;top:10%;background:#fff;border:3px solid #000;padding:4px 12px;font-weight:900;font-size:22px}
.fist{position:absolute;z-index:6;left:50%;top:64%;width:150px;transform:translate(-50%,-50%) scale(.22);animation:punch .36s cubic-bezier(.7,0,1,1) forwards}
.fist svg{width:100%;height:auto;filter:drop-shadow(5px 5px 0 #000)}
.boom{position:absolute;z-index:7;left:50%;top:22%;transform:translateX(-50%) rotate(-8deg);font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Noto Sans JP','Meiryo',sans-serif;font-weight:900;font-size:clamp(60px,15vw,170px);color:#E8102E;-webkit-text-stroke:5px #0A0A0A;paint-order:stroke fill;animation:sfxIn .3s cubic-bezier(.2,1.8,.4,1);line-height:1;white-space:nowrap}
@keyframes spd{50%{transform:scale(1.02) rotate(.4deg)}}
@keyframes sfxIn{0%{transform:rotate(var(--r,0deg)) scale(2.2);opacity:0}100%{transform:rotate(var(--r,0deg)) scale(1);opacity:1}}
@keyframes panelIn{from{transform:rotate(-3deg) scaleY(0)}to{transform:rotate(-3deg) scaleY(1)}}

/* ================= v4 : vitre ================= */
.shards{position:fixed;inset:0;z-index:85;background:#050304;overflow:hidden;perspective:1100px}
.shard{position:absolute;inset:0;overflow:hidden;background:var(--bgimg),var(--bg);will-change:transform;backface-visibility:hidden;transform-style:preserve-3d}
.shard.frost{background:rgba(226,232,240,.78);background-image:radial-gradient(rgba(255,255,255,.95) .7px,transparent 1px),radial-gradient(rgba(150,160,175,.6) .6px,transparent .9px);background-size:3px 3px,5px 5px}
.shard .glint{position:absolute;inset:0;pointer-events:none}
.shard .clone{position:absolute;left:0;top:0;width:100%;visibility:visible!important}
.cracks{position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity .35s}
.dust{position:absolute;z-index:6;border-radius:50%;background:#fff;box-shadow:0 0 4px #fff;pointer-events:none;animation:dust var(--d) cubic-bezier(.2,.7,.4,1) forwards}
@keyframes dust{to{transform:translate(var(--tx),var(--ty));opacity:0}}
.ko-end{position:absolute;inset:0;z-index:8;display:grid;place-items:center;text-align:center;background:#F3EFE7;animation:fade .35s}
.ko-end .speed{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.ko-inner{position:relative;z-index:2}
.ko-big{font-size:clamp(70px,17vw,160px);font-weight:900;color:#0A0A0A;-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:8px 8px 0 #E8102E;line-height:1;animation:sfxIn .35s cubic-bezier(.2,1.8,.4,1)}
.ko-end .mw{width:170px;margin:4px auto}.ko-end .mw .mon{width:100%;height:auto}
.ko-end p{color:#333;font-weight:900;margin:4px 0 0}

/* ================= v4 : sans-faute ================= */
.pf{position:fixed;inset:0;z-index:75;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(255,111,177,.25),rgba(15,11,12,.72));animation:fade .3s}
.pf-title{position:absolute;top:5%;left:50%;transform:translateX(-50%);font-size:clamp(34px,8vw,76px);font-weight:900;color:var(--pink);text-shadow:0 5px 0 #6E1A47,0 0 30px rgba(255,111,177,.6);white-space:nowrap;animation:pop .45s}
.pf-count{position:absolute;top:calc(5% + clamp(44px,10vw,90px));left:50%;transform:translateX(-50%);font-weight:900;color:#FFD0E6;font-size:clamp(15px,2.4vw,20px);white-space:nowrap;background:rgba(0,0,0,.35);padding:6px 14px;border-radius:99px}
.pfm{position:absolute;left:0;top:0;width:clamp(110px,22vw,190px);cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.pfm .mon{width:100%;height:auto}
.pf-skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
.squish{position:absolute;left:50%;top:52%;width:min(96vw,680px);transform:translate(-50%,-50%) scale(1.28,.84);animation:squishIn .3s cubic-bezier(.2,1.5,.5,1)}
.squish .mon{width:100%;height:auto}
.squish .glare{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.35) 42%,rgba(255,255,255,0) 50%,rgba(255,255,255,0) 60%,rgba(255,255,255,.18) 66%,rgba(255,255,255,0) 72%);pointer-events:none}
.squish.out{animation:squishOut .4s ease forwards}
.pf-sfx{position:absolute;left:50%;top:14%;transform:translateX(-50%) rotate(-6deg);font-size:clamp(30px,6vw,56px);font-weight:900;color:#fff;-webkit-text-stroke:3px #B03A75;paint-order:stroke fill;animation:sfxIn .3s}
@keyframes squishIn{from{transform:translate(-50%,-50%) scale(.3,.3);opacity:0}to{transform:translate(-50%,-50%) scale(1.28,.84);opacity:1}}
@keyframes squishOut{to{transform:translate(-50%,-50%) scale(.2,.2);opacity:0}}

/* =================== v5 : remets dans l'ordre =================== */
.ord-dir{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-weight:900;font-size:clamp(12.5px,1.6vw,14px);color:var(--text)}
.ord-dir span{flex:none;background:var(--s2);border:2px solid var(--line2);border-radius:99px;padding:5px 11px;white-space:nowrap}
.ord-dir span.a{border-color:#5B8CFF;color:#BFD1FF}
.ord-dir span.b{border-color:var(--pink);color:#FFC3DF}
.ord-dir i{flex:1;height:8px;border-radius:9px;background:linear-gradient(90deg,#5B8CFF,var(--pink));position:relative;min-width:30px}
.ord-dir i::before{content:'';position:absolute;inset:0;border-radius:9px;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.75) 9px 12px,transparent 12px 20px);animation:v5flow .9s linear infinite}
.ord-dir i::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);border:9px solid transparent;border-left:13px solid var(--pink);border-right:0}

.ord-slots{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;padding:12px;border:2px dashed var(--line2);border-radius:18px;background:rgba(255,255,255,.015);margin-bottom:10px}

/* =================== v5 : micro-animations =================== */

@keyframes v5exOut{to{transform:translateX(-46px);opacity:0}}
.ex-in .opts .opt,.ex-in .tf .opt,.ex-in .pcol .opt{animation:v5optIn .34s cubic-bezier(.2,1.2,.4,1) backwards}
.ex-in .opts .opt:nth-child(1),.ex-in .pcol .opt:nth-child(1),.ex-in .tf .opt:nth-child(1){animation-delay:.08s}
.ex-in .opts .opt:nth-child(2),.ex-in .pcol .opt:nth-child(2),.ex-in .tf .opt:nth-child(2){animation-delay:.14s}
.ex-in .opts .opt:nth-child(3),.ex-in .pcol .opt:nth-child(3){animation-delay:.2s}
.ex-in .opts .opt:nth-child(4),.ex-in .pcol .opt:nth-child(4){animation-delay:.26s}
.ex-in .pcol .opt:nth-child(5){animation-delay:.32s}
.ex-in .pcol .opt:nth-child(6){animation-delay:.38s}
@keyframes v5optIn{from{transform:translateY(16px) scale(.94);opacity:0}}
.ex-in .bubble{animation:v5bubble .4s cubic-bezier(.2,1.4,.4,1) .05s backwards;transform-origin:0 50%}
@keyframes v5bubble{from{transform:scale(.6);opacity:0}}
@media (hover:hover){
  .opt,.tile,.oslot.full,.node,.rbtn,.wdot,.item,.c-item{transition:transform .15s ease,background .1s,border-color .1s,box-shadow .15s}
  .opt.kb,.tile:not(.used).kb{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .rbtn.kb,.wdot.kb,.item.kb,.c-item.kb{transform:translateY(-2px) scale(1.02)}
}
.opt.sel,.tile.sel{animation:v5sel .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes v5sel{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.opt.sel{box-shadow:0 0 0 4px rgba(255,138,61,.14)}
.opt.ok{animation:v5ok .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes v5ok{40%{transform:scale(1.04)}}
#checkBtn:not(:disabled){animation:v5glow 1.6s ease-in-out infinite}
@keyframes v5glow{50%{box-shadow:0 4px 0 var(--red-d),0 0 22px rgba(255,59,78,.5)}}
.blank{transition:background .2s}
.hbreak{position:fixed;z-index:95;font-size:30px;pointer-events:none;transform:translate(-50%,-50%);animation:v5hb 1.05s ease-out forwards}
@keyframes v5hb{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(-50%,40px) scale(1) rotate(25deg);opacity:0}}
#home:not([hidden]),#end:not([hidden]),#cours:not([hidden]){animation:v5screen .4s cubic-bezier(.2,.9,.3,1)}
#lesson:not([hidden]){animation:v5screenL .35s ease}
@keyframes v5screen{from{opacity:0;transform:translateY(14px)}}
@keyframes v5screenL{from{opacity:0;transform:scale(.985)}}
.msheet{animation:v5sheet .42s cubic-bezier(.2,1.25,.4,1)}
@keyframes v5sheet{from{transform:translateY(60px) scale(.96);opacity:0}}
.end-in>*{animation:v5up .45s cubic-bezier(.2,1.2,.4,1) backwards}
.end-in>*:nth-child(2){animation-delay:.08s}.end-in>*:nth-child(3){animation-delay:.14s}.end-in>*:nth-child(4){animation-delay:.2s}
.end-in>*:nth-child(5){animation-delay:.26s}.end-in>*:nth-child(6){animation-delay:.32s}.end-in>*:nth-child(7){animation-delay:.38s}
.end-in>*:nth-child(8){animation-delay:.44s}.end-in>*:nth-child(9){animation-delay:.5s}.end-in>*:nth-child(10){animation-delay:.56s}
.end-in .card{animation:v5up .45s cubic-bezier(.2,1.4,.4,1) backwards}
.end-in .card:nth-child(2){animation-delay:.25s}.end-in .card:nth-child(3){animation-delay:.35s}
@keyframes v5up{from{transform:translateY(22px) scale(.92);opacity:0}}
.prop.ping{animation:ping .8s ease,v5propZoom .5s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:50% 60%}
@keyframes v5propZoom{40%{transform:scale(1.12)}}
.ripple{position:absolute;z-index:4;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;pointer-events:none;animation:v5ripple .65s ease-out forwards}
@keyframes v5ripple{to{transform:scale(6);opacity:0}}
.logo{cursor:pointer}
.logo .mon.wig{animation:v5wig .35s ease}
@keyframes v5wig{30%{transform:rotate(-14deg) scale(1.1)}70%{transform:rotate(10deg)}}

/* =================== v5 : ambiance manga =================== */
.scene{border:3px solid #050505;box-shadow:0 0 0 4px #EDE6DA,0 0 0 7px #050505,0 18px 44px rgba(0,0,0,.6);border-radius:6px;margin-top:6px}
.scene::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.55) .9px,transparent 1.25px);background-size:5px 5px;opacity:.22;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 34%,transparent 70%,#000 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 34%,transparent 70%,#000 100%)}
.jsfx{font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Noto Sans CJK JP','Noto Sans JP','Meiryo',sans-serif;font-weight:900;fill:#fff;stroke:#050505;stroke-width:3.2px;paint-order:stroke fill;letter-spacing:-.5px;pointer-events:none;opacity:.88}
.wnav .wtitle b{font-style:italic;letter-spacing:.01em;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,4px 4px 0 color-mix(in srgb,var(--wc) 70%,#000)}
.wnav .wtitle small{font-style:italic}
.wsay{background:#FFFFFF;color:#0A0A0A;border:3px solid #050505;border-radius:22px/18px;box-shadow:5px 5px 0 #050505;margin-top:14px}

@keyframes v5fall{from{top:-6%}to{top:106%}}
@keyframes v5sway{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(16px) rotate(120deg)}50%{transform:translateX(calc(var(--sx) * .5)) rotate(260deg)}75%{transform:translateX(calc(var(--sx) * .7 + 14px)) rotate(400deg)}100%{transform:translateX(var(--sx)) rotate(540deg)}}
.egg{cursor:pointer}
.egg .sunface{opacity:0;transition:opacity .4s}
.egg.on .sunface{opacity:1;animation:v5peek 4.2s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes v5peek{0%{transform:translateY(40px)}14%,86%{transform:translateY(-62px)}100%{transform:translateY(40px)}}
.egg .sunface ellipse:nth-of-type(1){transform-box:fill-box;transform-origin:center}
@keyframes v5wink{0%,100%{transform:none}50%{transform:scale(1.04)}}
.egg .mooneye{transform:scaleY(0);transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.egg.on .mooneye{transform:scaleY(1)}
.egg.nudge{animation:v5nudge .3s ease;transform-box:fill-box;transform-origin:center}
@keyframes v5nudge{40%{transform:scale(1.06) rotate(-4deg)}}
.ssfx{position:absolute;z-index:8;transform:translate(-50%,-50%) rotate(var(--r));font-family:'Hiragino Kaku Gothic Pro','Yu Gothic','Noto Sans CJK JP','Noto Sans JP','Meiryo',sans-serif;font-weight:900;font-size:clamp(22px,5vw,40px);color:#fff;-webkit-text-stroke:3px #050505;paint-order:stroke fill;pointer-events:none;white-space:nowrap;animation:v5ssfx 1.5s cubic-bezier(.2,1.6,.4,1) forwards;line-height:1}
.ssfx.big{font-size:clamp(30px,7vw,58px);color:#E8102E}
.ssfx.pink{color:#FF6FB1}
@keyframes v5ssfx{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(2.2);opacity:0}15%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-80%) rotate(var(--r)) scale(1);opacity:0}}
.ecg{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.ecg path{fill:none;stroke:#FF6FB1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:v5ecg 1.1s linear forwards;filter:drop-shadow(0 0 4px #FF6FB1)}
@keyframes v5ecg{to{stroke-dashoffset:0}}
.ecg-heart{position:absolute;left:50%;top:37.5%;z-index:7;transform:translate(-50%,-50%) scale(0);font-size:clamp(40px,9vw,80px);color:#FF6FB1;text-shadow:0 0 18px #FF6FB1,3px 3px 0 #050505;animation:v5beat .9s ease .5s 3 both;pointer-events:none}
@keyframes v5beat{0%{transform:translate(-50%,-50%) scale(.8)}30%{transform:translate(-50%,-50%) scale(1.25)}60%{transform:translate(-50%,-50%) scale(.95)}100%{transform:translate(-50%,-50%) scale(1)}}
.erupt{position:absolute;z-index:6;width:0;height:0;pointer-events:none}
.erupt i{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#FF7A00 55%,#C21F00);box-shadow:0 0 8px #FF7A00;animation:v5erupt 1.6s cubic-bezier(.2,.7,.5,1) forwards}
@keyframes v5erupt{0%{transform:translate(0,0) scale(.4)}45%{transform:translate(calc(var(--tx) * 3.2),calc(var(--ty) * 3.2)) scale(1)}100%{transform:translate(calc(var(--tx) * 4.4),calc(var(--ty) * 1.2 + 260%)) scale(.6);opacity:0}}
.wbuddy.ultra .bw{animation:v5ultra .12s steps(2) infinite}
.wbuddy.ultra .flip{filter:drop-shadow(0 0 10px #FF1030) drop-shadow(0 0 22px #FF1030) saturate(1.4);transform-origin:50% 100%;animation:v5ultraG 3.4s ease forwards}
@keyframes v5ultra{50%{transform:translate(2px,-1px)}}
@keyframes v5ultraG{0%{transform:scale(1)}12%{transform:scale(1.35)}85%{transform:scale(1.35)}100%{transform:scale(1)}}
.egg-line{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--muted)}

/* =================== v5 : voyage (vitesse + flou) =================== */
.scene.warp .layer{animation:v5warp 1.75s ease-in-out}
@keyframes v5warp{0%{filter:none}25%{filter:blur(5px) brightness(1.15) saturate(1.3)}70%{filter:blur(5px) brightness(1.15) saturate(1.3)}100%{filter:none}}
.warpfx{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;animation:v5warpfx 1.8s ease forwards}
.warpfx i{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:v5streakL linear infinite}

.warpfx i:nth-child(3n){height:4px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
@keyframes v5streakL{from{left:105%}to{left:-70%}}
@keyframes v5streakR{from{left:-70%}to{left:105%}}
@keyframes v5warpfx{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}

.cine{position:fixed;inset:0;z-index:80;overflow:hidden;pointer-events:auto}

@keyframes v5debris{to{transform:translateY(120vh) rotate(var(--rot))}}
.titanko.s2 .cine-bg{background:rgba(40,0,6,.6);animation:v5pulse .66s ease-in-out infinite}
@keyframes v5pulse{50%{background:rgba(70,0,10,.68)}}
.titanko.s3 .cine-bg{background:#0A0204;animation:none}
.cine.s2 .cine-bg,.cine.s3 .cine-bg,.cine.s3 .rays,.cine.s3 .vign,.cine.s3 .debris{transition:none}
.rays{position:absolute;left:50%;top:58%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;z-index:1;opacity:0;transition:opacity .8s;-webkit-mask-image:radial-gradient(circle,transparent 4%,#000 20%,transparent 60%);mask-image:radial-gradient(circle,transparent 4%,#000 20%,transparent 60%);animation:v5spin 14s linear infinite}

@keyframes v5spin{to{transform:rotate(360deg)}}
.titan{position:absolute;left:50%;bottom:-4vh;z-index:4;width:min(118vw,92vh,860px);transform:translate(-50%,105%);transition:transform 1.25s cubic-bezier(.15,.9,.25,1)}
