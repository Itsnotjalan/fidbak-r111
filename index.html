.starev.s1 .cine-bg{background:radial-gradient(circle at 50% 55%,rgba(255,150,200,.35),rgba(10,4,12,.9))}
.starev.s3 .cine-bg{background:radial-gradient(circle at 50% 55%,#FFE2F0 0%,#FF8FC4 22%,#5A1640 60%,#12040C 100%)}
.pillar{position:absolute;left:50%;top:0;bottom:0;width:min(46vw,300px);transform:translateX(-50%) scaleY(0);transform-origin:50% 0;z-index:2;background:linear-gradient(90deg,transparent,rgba(255,240,250,.85) 35%,#fff 50%,rgba(255,240,250,.85) 65%,transparent);filter:blur(4px);transition:transform .5s cubic-bezier(.6,0,.2,1),opacity .4s}
.starev.s2 .pillar{transform:translateX(-50%) scaleY(1)}
.starev.s3 .pillar{opacity:0}
.pf-desc{position:absolute;left:50%;top:-30%;z-index:5;width:clamp(150px,30vw,240px);transform:translate(-50%,-50%);opacity:0}
.pf-desc .mon{width:100%;height:auto}
.starev.s2 .pf-desc{opacity:1;animation:v5descend 1.35s cubic-bezier(.3,.6,.2,1) forwards}
.starev.s3 .pf-desc{display:none}
@keyframes v5descend{0%{top:-25%;transform:translate(-50%,-50%) rotate(0) scale(.6)}70%{top:52%;transform:translate(-50%,-50%) rotate(720deg) scale(1.05)}100%{top:50%;transform:translate(-50%,-50%) rotate(720deg) scale(1)}}
.star-form{position:absolute;left:50%;top:60%;z-index:5;width:min(94vw,62vh,640px);transform:translate(-50%,-50%);animation:v5reveal .7s cubic-bezier(.2,1.4,.4,1)}
.star-form .mon{width:100%;height:auto;display:block;filter:drop-shadow(0 0 30px rgba(255,220,120,.6)) drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.star-form .mon.star{animation:v5float 2.4s ease-in-out infinite}
@keyframes v5reveal{from{transform:translate(-50%,-50%) scale(.25) rotate(-20deg);opacity:0}}
@keyframes v5float{50%{transform:translateY(-12px)}}
.starev.s4 .star-form{transition:transform .5s cubic-bezier(.6,0,.4,1),opacity .5s;transform:translate(-50%,-50%) scale(.15);opacity:0}
.starev.s4 .evo-title,.starev.s4 .rays{opacity:0;transition:opacity .3s}
.sparkles{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .5s}
.starev.s3 .sparkles{opacity:1}
.sparkles i{position:absolute;width:14px;height:14px;transform:scale(var(--s));background:#FFF4C2;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:v5twk 1.6s ease-in-out infinite}
@keyframes v5twk{0%,100%{opacity:0;transform:scale(calc(var(--s) * .3)) rotate(0)}50%{opacity:1;transform:scale(var(--s)) rotate(45deg)}}
.ko-sub{font-weight:900;letter-spacing:.4em;color:#E8102E;font-size:clamp(13px,2.4vw,18px);margin-top:-4px}

/* =================== v5 : cours annotable =================== */
#cours{min-height:100vh;min-height:100dvh;background:var(--bg)}
.c-top{position:sticky;top:0;z-index:30;background:rgba(15,11,12,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.c-top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px var(--gut) 6px}
.c-top .x{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line2);background:var(--s1);color:var(--text);font-size:20px;font-weight:900;cursor:pointer}
.c-title{flex:1;min-width:0}
.c-title small{display:block;font-weight:900;font-size:11px;letter-spacing:.12em;color:var(--pink)}
.c-title b{display:block;font-weight:900;font-size:clamp(15px,2.4vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.c-nav{display:flex;gap:6px}
.c-nav button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line2);background:var(--s1);color:var(--text);font-weight:900;cursor:pointer}
.c-nav button:disabled{opacity:.3;cursor:default}
.c-tools{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:4px var(--gut) 10px;overflow-x:auto;scrollbar-width:none}
.c-tools::-webkit-scrollbar{display:none}
.ct{flex:none;display:flex;align-items:center;gap:5px;height:38px;padding:0 11px;border-radius:12px;border:2px solid var(--line2);border-bottom-width:4px;background:var(--s1);color:var(--text);font:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:transform .12s,background .12s,border-color .12s}
.ct span{font-size:12.5px}
.ct.on{background:var(--pink-l);border-color:var(--pink);color:#FFC3DF;transform:translateY(-1px)}
.ct.mini{padding:0 10px}
.ct.warn{background:var(--bad-l);border-color:var(--bad);color:#FF9AA5}
.ct:active{transform:translateY(2px);border-bottom-width:2px}
.c-sw{display:flex;gap:5px;padding-left:4px}
.c-sw:empty{display:none}
.c-sp{flex:1}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:var(--sc);cursor:pointer;transition:transform .15s}
.sw.hl{border-radius:7px}
.sw.on{transform:scale(1.18);border-color:#fff;box-shadow:0 0 0 2px var(--sc)}
@media (max-width:560px){ .ct span{display:none} .ct{padding:0 9px} .c-tools{flex-wrap:wrap;overflow:visible;row-gap:6px} .sw{width:24px;height:24px} }
.c-wrap{max-width:860px;margin:0 auto;padding:14px var(--gut) 40px}
.c-tip{display:flex;align-items:center;gap:10px;margin:0 0 14px;background:#fff;color:#0A0A0A;border:3px solid #050505;border-radius:20px/16px;box-shadow:4px 4px 0 #050505;padding:6px 14px 6px 6px;font-weight:800;font-size:14px}
.c-tip .who{flex:none;width:52px}.c-tip .who .mon{width:100%;height:auto}
.c-tip p{margin:0}
.c-page{position:relative;background:#FBF7EE;color:#1D1A20;border-radius:6px;box-shadow:0 0 0 3px #050505,8px 8px 0 #050505,0 20px 50px rgba(0,0,0,.5);padding:26px 24px 30px 64px;background-image:linear-gradient(90deg,transparent 46px,rgba(232,16,46,.45) 46px,rgba(232,16,46,.45) 48px,transparent 48px),repeating-linear-gradient(180deg,transparent 0,transparent 29px,rgba(70,110,200,.16) 29px,rgba(70,110,200,.16) 30px);line-height:1.55;animation:v5page .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes v5page{from{transform:translateY(20px) rotate(-.6deg);opacity:0}}
.c-page::before{content:'';position:absolute;left:14px;top:30px;bottom:30px;width:14px;background:radial-gradient(circle,#0F0B0C 5px,transparent 5.5px) 0 0/14px 64px repeat-y;opacity:.85}
.c-head small{display:block;font-weight:900;letter-spacing:.14em;font-size:11px;color:#8A7B80}
.c-head h2{margin:2px 0 8px;font-size:clamp(22px,3.6vw,30px);font-weight:900;font-style:italic;color:#111;text-shadow:3px 3px 0 color-mix(in srgb,var(--uc) 45%,transparent)}
.c-content h4{display:inline-block;margin:18px 0 6px;font-size:17px;font-weight:900;color:#fff;background:#C8102E;padding:2px 10px;transform:rotate(-1deg);box-shadow:3px 3px 0 #050505}
.c-content ul,.c-content ol{margin:0;padding-left:20px;font-weight:600;font-size:16px}
.c-content li{margin:3px 0}
.c-content b{color:#A30D25}
.c-content i{color:#3B3540}
.c-content .warn{background:#FFE4E8;border:2px solid #C8102E;color:#8E0F20;border-radius:10px;padding:10px 12px;font-weight:800;font-size:15px;margin-top:14px}
.c-content .sch{background:#fff;border:2.5px dashed #1D1A20;border-radius:10px;padding:10px 12px;font-weight:800;font-size:15px;text-align:center;line-height:1.6;margin:10px 0;color:#1D1A20}
.c-end{text-align:center;color:#9A8C90;font-weight:800;font-style:italic;margin-top:22px;font-size:13px}
#ccan{position:absolute;left:0;top:0;z-index:3;pointer-events:none;touch-action:auto}
.c-page[data-tool="pen"] #ccan,.c-page[data-tool="hl"] #ccan,.c-page[data-tool="eraser"] #ccan{pointer-events:auto;touch-action:none;cursor:crosshair}
.c-page[data-tool="eraser"] #ccan{cursor:cell}
.c-page[data-tool="read"] .c-content{user-select:text;-webkit-user-select:text}
.c-back{margin-top:22px}
@media (max-width:560px){ .c-page{padding:18px 14px 24px 44px;background-image:linear-gradient(90deg,transparent 32px,rgba(232,16,46,.45) 32px,rgba(232,16,46,.45) 34px,transparent 34px),repeating-linear-gradient(180deg,transparent 0,transparent 29px,rgba(70,110,200,.16) 29px,rgba(70,110,200,.16) 30px)} .c-page::before{left:7px;width:12px;background-size:12px 64px} .c-content ul,.c-content ol{font-size:15px} }
.c-intro{color:var(--muted);font-weight:700;font-size:14px;margin:0 0 12px}
.c-list{display:grid;gap:8px}
.c-item{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line2);border-bottom-width:4px;border-radius:14px;background:var(--s1);color:var(--text);padding:10px 12px;font:inherit;cursor:pointer}
.c-item .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--uc);color:#fff;font-weight:900;box-shadow:2px 2px 0 #000}
.c-item .t{flex:1;min-width:0}.c-item b{display:block;font-weight:900}.c-item small{color:var(--muted);font-weight:700}
.c-item .go{color:var(--pink);font-weight:900}

/* =====================================================================
   FIDBAK v6 — DA façon JRPG (noir / blanc / anthracite + rouge d'action)
   Desktop-first (1280 px et plus). Écrans < 960 px : message « sur PC ».
   ===================================================================== */
:root{
  --k:#08080A; --k2:#101013; --c1:#17171B; --c2:#1F1F24; --c3:#2A2A31; --c4:#3A3A42;
  --w:#FFFFFF; --g1:#D4D4D8; --g2:#A1A1AA; --g3:#71717A;
  --r:#E5122E; --r2:#A50A1F; --r3:#FF2D4A;
  --ez:cubic-bezier(.16,1,.3,1); --ez2:cubic-bezier(.7,0,.84,0);
  --fd:'Anton','Impact','Haettenschweiler','Arial Narrow',sans-serif;
  --fb:'InterV','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pad:clamp(40px,4.4vw,80px);
  /* anciennes variables, recalées sur la palette */
  --bg:#08080A; --s1:#141418; --s2:#1C1C21; --s3:#27272D; --line:#26262C; --line2:#3A3A42;
  --text:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --red:#E5122E; --red-d:#7A0716; --sel:#E5122E; --sel-l:rgba(229,18,46,.14);
  --pink:#FFFFFF; --pink-d:#A1A1AA; --pink-l:rgba(255,255,255,.08);
  --bad:#E5122E; --bad-d:#7A0716; --bad-l:rgba(229,18,46,.14);
  --gold:#FFFFFF; --gold-d:#71717A; --gut:var(--pad);
}
html,body{background:var(--k)}
body{font-family:var(--fb);font-size:17px;line-height:1.5;color:var(--w);background:var(--k);font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
   linear-gradient(118deg,transparent 0 58%,rgba(255,255,255,.035) 58% 58.25%,transparent 58.25% 63%,rgba(255,255,255,.025) 63% 63.12%,transparent 63.12%),
   radial-gradient(rgba(255,255,255,.07) .9px,transparent 1.3px) 0 0/8px 8px;
  -webkit-mask-image:linear-gradient(160deg,transparent 30%,#000 75%);mask-image:linear-gradient(160deg,transparent 30%,#000 75%)}
body::after{content:'';position:fixed;z-index:-1;pointer-events:none;right:-8vw;top:-12vh;width:44vw;height:58vh;background:var(--c1);clip-path:polygon(28% 0,100% 0,100% 100%,0 64%)}
::selection{background:var(--r);color:#fff}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--w);outline-offset:3px}
.p-kicker{display:block;font-family:var(--fb);font-weight:800;font-size:12px;letter-spacing:.22em;color:var(--g2);text-transform:uppercase}
.p-h{font-family:var(--fd);font-weight:400;font-size:clamp(28px,2.4vw,36px);line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin:6px 0 14px;transform:skewX(-6deg);transform-origin:0 100%}
.p-tag{display:inline-block;font-family:var(--fb);font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:var(--w);color:var(--k);padding:5px 12px 4px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.p-tag.red{background:var(--r);color:#fff}

/* ---------- typo « coupures de journal » ---------- */
.ransom{display:inline-flex;align-items:center;gap:2px;font-family:var(--fd);font-weight:400;line-height:1}
.ransom i{display:inline-block;font-style:normal;padding:.08em .12em .02em;transform:rotate(var(--rt)) translateY(var(--dy));box-shadow:2px 2px 0 rgba(0,0,0,.6)}
.ransom i.w{background:var(--w);color:var(--k)}
.ransom i.k{background:var(--k);color:var(--w);outline:2px solid var(--w);outline-offset:-2px}
.ransom i.r{background:var(--r);color:#fff}
.ransom i.sp{width:.3em;box-shadow:none;background:none;padding:0}

/* ---------- boutons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:none;border-radius:0;box-shadow:none;padding:18px 34px 17px;font-family:var(--fd);font-weight:400;font-size:21px;letter-spacing:.06em;text-transform:uppercase;line-height:1;background:var(--r);color:#fff;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s,filter .34s;filter:none}
.btn.kb{background:var(--w);color:var(--k);transform:translate(-3px,-3px) skewX(-4deg);filter:drop-shadow(6px 6px 0 var(--r))}
.btn:active{transform:translate(1px,1px);filter:none}
.btn:disabled{background:var(--c3);color:var(--g3);transform:none;filter:none;cursor:default}
.btn.good{background:var(--w);color:var(--k)}
.btn.good.kb{background:var(--r);color:#fff;filter:drop-shadow(6px 6px 0 var(--w))}
.btn.bad{background:var(--r)}
.btn.ghost{background:var(--c2);color:var(--w);border:none;box-shadow:none}
.btn.ghost.kb{background:var(--w);color:var(--k)}
.btn.ghost.danger{color:#FF8E9C}
.btn.ghost.danger.kb{background:var(--r);color:#fff}
.btn.wide{width:100%}
.btn + .btn{margin-top:0}
.p-actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px 18px;margin-top:30px}
.p-btn{display:inline-flex;align-items:center;gap:10px;border:none;padding:14px 26px 13px;font-family:var(--fd);font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1;background:var(--w);color:var(--k);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.p-btn.red{background:var(--r);color:#fff}
.p-btn.kb{background:var(--w);color:var(--k);transform:translate(-2px,-3px) skewX(-5deg);filter:drop-shadow(5px 5px 0 var(--r))}
.p-arrow{width:54px;height:50px;border:none;background:var(--c2);color:var(--w);font-size:18px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.p-arrow:not(:disabled).kb{background:var(--w);color:var(--k);transform:translateY(-3px) skewX(-6deg)}
.p-arrow:disabled{opacity:.25;cursor:default}
.p-icon{width:54px;height:54px;border:none;background:var(--c2);color:var(--w);font-size:24px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.p-icon.kb{background:var(--w);color:var(--k);transform:rotate(-6deg) scale(1.06)}
.p-x{width:52px;height:52px;flex:none;border:none;background:var(--c2);color:var(--w);font-size:20px;font-weight:900;padding:0;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.p-x.kb{background:var(--w);color:var(--k);transform:skewX(-8deg)}

/* ---------- écrans trop petits ---------- */
#gate{display:none}
@media (max-width:959px),(max-height:539px){
  #gate{display:flex;position:fixed;inset:0;z-index:999;align-items:center;justify-content:center;background:var(--k);padding:28px;overflow:auto}
  body{overflow:hidden}
  #audioPanel,#qbg,#glass{display:none!important}
}
#gate .g-card{position:relative;max-width:520px;width:100%;background:var(--w);color:var(--k);padding:42px 34px 36px;clip-path:polygon(0 0,100% 4%,96% 100%,3% 96%);text-align:left}
#gate .g-card::before{content:'';position:absolute;right:-30px;top:-20px;width:46%;height:58%;background:var(--r);clip-path:polygon(30% 0,100% 0,100% 100%,0 70%)}
#gate .g-m{position:relative;width:150px;margin:-10px 0 6px}
#gate .g-m .mon{width:100%;height:auto}
#gate small{position:relative;display:block;font-weight:900;letter-spacing:.2em;font-size:12px;color:#555}
#gate h1{position:relative;margin:8px 0 14px;font-size:44px}
#gate p{position:relative;margin:0 0 10px;font-weight:600;font-size:16px;line-height:1.55;color:#222}
#gate p b{color:var(--r)}

/* =====================================================================
   ACCUEIL
   ===================================================================== */
.p-top{position:relative;z-index:20}
.p-top-in{max-width:1720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:40px;padding:26px calc(var(--pad) + 450px) 18px var(--pad)}
.p-logo{display:flex;align-items:center;gap:16px;border:none;background:none;color:var(--w);padding:0;text-align:left}
.p-logo .mon{width:52px;height:auto;flex:none;filter:drop-shadow(3px 3px 0 #000)}
.p-logo .ransom{font-size:38px}
.p-logo small{display:block;margin-left:6px;font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--g2);text-transform:uppercase;align-self:flex-end;padding-bottom:4px}
.p-logo.kb .ransom i{animation:rjig .4s var(--ez)}
.p-logo.kb .ransom i:nth-child(2n){animation-delay:.04s}
@keyframes rjig{40%{transform:rotate(calc(var(--rt) * -2)) translateY(-4px)}}
.p-stats{display:flex;align-items:center;gap:14px}
.p-stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--c1);padding:9px 20px 9px 18px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);min-width:92px}
.p-stat small{font-weight:800;font-size:10.5px;letter-spacing:.2em;color:var(--g2)}
.p-stat b{font-family:var(--fd);font-weight:400;font-size:24px;line-height:1;letter-spacing:.02em}
.p-home{max-width:1720px;margin:0 auto;display:grid;justify-content:center;grid-template-columns:minmax(0,max(640px,calc((100vh - 250px) * 1.25 + 14px))) clamp(360px,25vw,440px);gap:clamp(44px,4.4vw,84px);padding:20px var(--pad) 40px;align-items:start}
.p-world{position:relative;min-width:0}
.p-wnav{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin:0 0 26px}
.p-wt h2{margin:6px 0 0;font-family:var(--fd);font-weight:400;font-size:clamp(40px,3.6vw,60px);line-height:.95;text-transform:uppercase;letter-spacing:.005em;transform:skewX(-8deg);transform-origin:0 100%;animation:pSlam .85s var(--ez) both}
.p-wt h2 .ico{display:inline-block;transform:skewX(8deg);font-size:.75em;vertical-align:.08em}
.p-wbtns{display:flex;align-items:center;gap:10px;flex:none}
.p-wbtns .p-btn{margin-left:14px}
.p-frame{position:relative;width:100%;padding:7px;background:var(--w);clip-path:polygon(0 0,calc(100% - 44px) 0,100% 44px,100% 100%,44px 100%,0 calc(100% - 44px));animation:pFrame .9s var(--ez) both}
.scene{margin:0;border:none;border-radius:0;box-shadow:none;clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,40px 100%,0 calc(100% - 40px));background:#000}
.scene::after{opacity:.16}
.scene .layer{filter:grayscale(1) contrast(1.14) brightness(1.04)}
@keyframes v5warp{0%{filter:grayscale(1) contrast(1.14)}25%,70%{filter:grayscale(1) contrast(1.3) brightness(1.2) blur(5px)}100%{filter:grayscale(1) contrast(1.14)}}
.jsfx{fill:#fff;stroke:#000}
.pmark{background:var(--w);color:var(--k);border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:28px;height:28px;box-shadow:none;font-family:var(--fd);font-size:15px;animation:float 1.4s ease-in-out infinite}
.pmark.seen{background:rgba(255,255,255,.35);color:var(--k);width:16px;height:16px;font-size:9px;animation:none}
.wnode .node,.node{border-radius:0;box-shadow:none;width:clamp(56px,4.6vw,76px);height:clamp(56px,4.6vw,76px);font-size:clamp(22px,1.9vw,30px);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:transform .34s var(--ez),background .3s,color .3s;filter:drop-shadow(0 0 0 transparent)}
.node.current,.node.open{background:var(--r);color:#fff}
.node.done{background:var(--w);color:var(--k);box-shadow:none}
.node.locked{background:var(--c3);color:var(--g3);box-shadow:none}
.wnode .node.boss{width:clamp(76px,6vw,100px);height:clamp(76px,6vw,100px)}
.node:not(.locked).kb{transform:scale(1.14) rotate(-8deg);background:var(--w);color:var(--k)}
.node.done.kb{background:var(--r);color:#fff}
.node:active{transform:scale(.96)}
.wnode.current::before{border-radius:0;border:4px solid var(--r);opacity:.8;transform:rotate(45deg);--rs:calc(clamp(56px,4.6vw,76px) + 26px)}
@keyframes ring{0%,100%{transform:rotate(45deg) scale(1);opacity:.85}50%{transform:rotate(45deg) scale(1.16);opacity:.25}}
.wnode .start-bubble{background:var(--r);color:#fff;border:none;border-radius:0;font-family:var(--fd);font-size:16px;letter-spacing:.1em;padding:6px 14px 5px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.wnode .start-bubble::after{display:none}
.wnode .nlabel{display:block;background:var(--k);color:var(--w);border-radius:0;font-weight:800;font-size:12.5px;padding:5px 12px;top:calc(100% + 10px);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.wnode .stars{top:calc(100% + 38px);color:var(--w);text-shadow:1px 1px 0 #000;font-size:13px}
.wnode.kb .stars{display:block}
.fog{background:rgba(8,8,10,.72)}
.fog b{font-family:var(--fd);font-weight:400;font-size:30px;text-transform:uppercase;letter-spacing:.03em}
.travel-banner div{background:var(--k);border:none;border-radius:0;padding:16px 34px 14px;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);animation:pBanner .8s var(--ez) .2s backwards}
.travel-banner small{color:var(--g2);letter-spacing:.24em;font-size:12px}
.travel-banner b{font-family:var(--fd);font-weight:400;font-size:40px;text-transform:uppercase;letter-spacing:.02em}
@keyframes pBanner{from{transform:translateX(-80px) skewX(-14deg);opacity:0}}
.wbuddy{width:clamp(110px,19%,180px)}

/* bulle de dialogue (monde, cours, fin) */
.p-say{position:relative;display:block;min-height:0;margin:0;padding:22px 30px 20px 92px;background:var(--k);color:var(--w);border:none;border-radius:0;box-shadow:none;font-weight:700;font-size:17px;line-height:1.5;clip-path:polygon(0 8px,100% 0,calc(100% - 10px) 100%,6px calc(100% - 4px));filter:none}
.p-say::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;height:auto;background:var(--r);border:none;transform:none;transition:none}
.p-say .who{position:absolute;left:22px;top:14px;width:56px}
.p-say .who .mon{width:100%;height:auto}
.p-say .say-name{display:inline-block;margin:0 0 6px;font-family:var(--fd);font-size:16px;letter-spacing:.12em;background:var(--w);color:var(--k);padding:3px 12px 2px;transform:skewX(-10deg) rotate(-2deg)}
.p-say .txt{display:block}
.p-say b{color:#fff;background:linear-gradient(transparent 62%,rgba(229,18,46,.75) 62%)}
.p-say i{color:var(--g2)}
.p-world .p-say{margin-top:22px;background:var(--c1)}
.p-world .wsay::after{content:'';position:absolute;left:calc(var(--bx,50%) - 11px);top:0;width:22px;height:13px;background:var(--k);clip-path:polygon(50% 0,100% 100%,0 100%);transform:translateY(-1px);transition:left .4s;display:none}
.p-say.mini{padding:16px 22px 16px 24px}
.p-say.mini p{margin:0}
.wstrip{justify-content:flex-start;gap:10px;margin:22px 0 0}
.wdot{border:none;border-radius:0;background:var(--c1);padding:10px 18px 9px 16px;gap:8px;font-weight:800;font-size:15px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.wdot .wn{color:var(--g2);font-family:var(--fd);font-size:16px;font-weight:400}
.wdot.on{background:var(--w);color:var(--k)}
.wdot.on .wn{color:var(--k)}
.wdot.done .wn::after{content:' ✔';color:inherit}
.wdot:not(.on).kb{background:var(--r);color:#fff;transform:translateY(-3px) skewX(-6deg)}
.wdot:not(.on).kb .wn{color:#fff}
.wdot.locked{opacity:.45}

/* colonne de droite */
.p-side{display:flex;flex-direction:column;gap:30px;padding-top:6px}
.p-side > *{animation:pIn .85s var(--ez) both}
.p-side > *:nth-child(2){animation-delay:.08s}.p-side > *:nth-child(3){animation-delay:.16s}.p-side > *:nth-child(4){animation-delay:.24s}
.p-card{position:relative;background:var(--c1);border:none;border-radius:0;padding:28px 30px 30px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.p-card p{margin:0 0 6px;color:var(--g1);font-weight:500;font-size:15.5px;line-height:1.6}
.p-card.goal .bar{height:10px;background:var(--c3);border-radius:0;margin-top:16px;overflow:hidden;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.p-card.goal .bar i{display:block;height:100%;background:var(--w);border-radius:0}
.fid-head{display:flex;align-items:center;gap:22px;margin-bottom:24px}
.fid-port{position:relative;flex:none;width:118px;height:118px}
.fid-port .fp-bg{position:absolute;inset:8px -4px -2px 6px;background:var(--w);clip-path:polygon(12% 0,100% 8%,88% 100%,0 90%)}
.fid-port .mw{position:absolute;left:-6px;right:-6px;bottom:0}
.fid-port .mw .mon{width:100%;height:auto;filter:drop-shadow(3px 3px 0 #000)}
.fid-id h3{margin:4px 0 8px;font-family:var(--fd);font-weight:400;font-size:40px;line-height:.95;text-transform:uppercase;transform:skewX(-8deg);transform-origin:0 100%}
.fid-id p{margin:10px 0 0;font-size:14px;color:var(--g2)}
.meters{display:flex;flex-direction:column;gap:12px}
.meter{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px}
.meter .lab{font-weight:900;font-size:11px;letter-spacing:.18em;color:var(--g2);width:auto;text-align:left}
.mbar{height:12px;background:var(--c3);border-radius:0;overflow:hidden;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.mbar i{border-radius:0;background:var(--w);transition:width 1s var(--ez)}
.mbar.bond i{background:var(--w)}
.mbar.xpb i{background:var(--g2)}
.meter small{font-weight:800;font-size:13px;color:var(--g1);min-width:0}
.next-step{font-size:14px;color:var(--g2);font-weight:600;padding-left:56px;margin:-4px 0 4px}
.next-step b{color:var(--w)}
.egg-line{margin:20px 0 0;font-size:13px;font-weight:700;color:var(--g2);letter-spacing:.02em}
.egg-line b{color:var(--w)}
.p-menu{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.p-mi{position:relative;display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:12px;width:100%;border:none;background:var(--c2);color:var(--w);padding:15px 22px 14px 18px;text-align:left;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.p-mi .mk{color:var(--r);font-size:12px;opacity:0;transform:translateX(-8px);transition:opacity .34s,transform .34s var(--ez)}
.p-mi .t{font-family:var(--fd);font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.p-mi small{font-weight:600;font-size:13px;color:var(--g2)}
.p-mi .dot{position:absolute;right:16px;top:10px;width:9px;height:9px;background:var(--r);border-radius:0;transform:rotate(45deg);border:none}
.p-mi.kb{background:var(--w);color:var(--k);transform:translateX(10px) skewX(-6deg)}
.p-mi.kb small{color:#444}
.p-mi.kb .mk{opacity:1;transform:none}
.p-practice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:none;background:var(--r);color:#fff;padding:22px 32px 20px;text-align:left;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);box-shadow:none;transition:transform .34s var(--ez),background .3s,color .3s}
.p-practice small{font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.p-practice b{font-family:var(--fd);font-weight:400;font-size:28px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.p-practice.kb{background:var(--w);color:var(--k);transform:translate(-4px,-4px) skewX(-5deg);filter:drop-shadow(7px 7px 0 var(--r))}
.legend .stages{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:18px}
.legend .stages>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.legend .stages .mon{width:100%;max-width:58px;height:auto}
.legend .stages span{font-size:11px;font-weight:800;color:var(--g2);text-align:center;letter-spacing:.02em}
.p-foot{max-width:1720px;margin:0 auto;padding:10px var(--pad) 48px;color:var(--g3);font-size:13px;font-weight:600;letter-spacing:.02em}
#mini{right:28px;bottom:28px;width:96px}
#mini .msay{background:var(--k);border:3px solid var(--w);border-radius:0;font-weight:700;width:240px;right:96px}

/* =====================================================================
   FENÊTRES, NOTIFICATIONS
   ===================================================================== */
.modal{align-items:center;z-index:60}
.backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.msheet.p-win{max-width:min(760px,90vw);width:100%;background:var(--w);border:none;border-radius:0;padding:7px;max-height:88vh;overflow:visible;clip-path:polygon(0 14px,100% 0,calc(100% - 8px) 100%,10px calc(100% - 6px));animation:pWin .75s var(--ez)}
.p-win .pw-in{background:var(--k);padding:44px 52px 46px;max-height:calc(88vh - 14px);overflow:auto;clip-path:polygon(0 13px,100% 0,calc(100% - 7px) 100%,9px calc(100% - 5px))}
.p-win .pw-r{position:absolute;right:-6px;top:-10px;width:120px;height:46px;background:var(--r);clip-path:polygon(20% 0,100% 0,100% 100%,0 60%);z-index:2}
.p-win .pw-r2{display:none}
@keyframes pWin{from{transform:translate(-60px,40px) skewX(-10deg) scale(.96);opacity:0}to{transform:none;opacity:1}}
.m-title{font-family:var(--fd);font-weight:400;font-size:38px;text-transform:uppercase;letter-spacing:.01em;margin:0 0 22px;transform:skewX(-6deg);transform-origin:0 100%}
.p-win .center{text-align:left}
.p-win .center .mw{width:140px;margin:0 0 10px}
.p-win .center h3{font-family:var(--fd);font-weight:400;font-size:40px;text-transform:uppercase;margin:6px 0 12px;transform:skewX(-6deg);transform-origin:0 100%}
.p-win .center p{color:var(--g1);font-size:17px;line-height:1.6}
.p-win .center .btn,.p-win .settings .btn,.p-win > .pw-in > .btn{margin-top:14px}
.p-win .center .btn + .btn{margin-left:14px}
.p-win .btn.wide{width:auto;min-width:220px}
.p-win .story small{color:var(--g2);letter-spacing:.2em}
.p-win .story p{font-size:18px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--c3);font-weight:700;font-size:17px}
.row input{width:22px;height:22px;accent-color:var(--r)}
.p-mission{display:grid;grid-template-columns:170px 1fr;gap:34px;align-items:center}
.pm-port{position:relative}
.pm-port::before{content:'';position:absolute;inset:14% -6% 0 4%;background:var(--w);clip-path:polygon(14% 0,100% 10%,86% 100%,0 88%)}
.pm-port .mon{position:relative;width:100%;height:auto;filter:drop-shadow(4px 4px 0 #000)}
.pm-sub{color:var(--g2);font-weight:600;margin:0 0 18px}
.pm-reward{margin-top:18px;font-weight:800;color:var(--g1);display:flex;align-items:center;gap:12px}
.p-mission .p-say{background:var(--c2)}
#toast{left:auto;right:28px;top:86px;transform:translateX(calc(100% + 60px)) skewX(-10deg);width:auto;max-width:440px;background:var(--w);color:var(--k);border:none;border-radius:0;padding:16px 26px 16px 18px;font-weight:800;font-size:15px;line-height:1.4;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .7s var(--ez),visibility .7s;gap:14px}
#toast.on{transform:none}
#toast.good{background:var(--w);color:var(--k)}
#toast .tr{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--r)}
#toast .mw{width:46px}

/* garde-robe */
.wd-prev{background:var(--c1);border-radius:0;clip-path:polygon(0 0,100% 6px,calc(100% - 6px) 100%,4px calc(100% - 4px));padding:20px 24px;gap:22px}
.wd-prev p{font-weight:700;font-size:16px}
.wd-slot h4{font-family:var(--fd);font-weight:400;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--g1);margin:28px 0 12px}
.wd-grid{gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{background:var(--c2);border:none;border-radius:0;color:var(--w);font-weight:700;padding:14px 12px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.item.kb{background:var(--w);color:var(--k);transform:translateY(-3px) skewX(-5deg)}
.item.on{background:var(--r);color:#fff;border:none}
.item.locked{opacity:.5}
.item .req{color:inherit;opacity:.75}
.c-intro{color:var(--g2)}
.c-list{gap:10px}
.c-item{border:none;background:var(--c2);border-radius:0;padding:16px 20px;gap:16px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.c-item .n{background:var(--w);color:var(--k);border-radius:0;box-shadow:none;font-family:var(--fd);font-weight:400;font-size:20px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.c-item b{font-family:var(--fd);font-weight:400;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.c-item .go{color:var(--r)}
.c-item.kb{background:var(--w);color:var(--k);transform:translateX(10px) skewX(-5deg)}
.c-item.kb small{color:#555}
.c-item.kb .n{background:var(--r);color:#fff}

/* =====================================================================
   LEÇON : interface de dialogue
   ===================================================================== */
#lesson{min-height:100vh;display:block}
.p-lesson{position:relative;height:100vh;min-height:700px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.p-bgfx{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.p-bgfx .s1{position:absolute;right:-4%;top:-10%;width:52%;height:78%;background:var(--c1);clip-path:polygon(34% 0,100% 0,100% 100%,0 72%)}
.p-bgfx .s2{position:absolute;left:-6%;bottom:-6%;width:42%;height:56%;background:repeating-linear-gradient(-62deg,rgba(255,255,255,.05) 0 2px,transparent 2px 16px);clip-path:polygon(0 30%,100% 0,64% 100%,0 100%)}
.p-bgfx .qn{position:absolute;right:calc(var(--pad) - 10px);top:96px;font-family:var(--fd);font-size:clamp(150px,15vw,250px);line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.1);transform:skewX(-10deg);letter-spacing:-.02em}
.p-hud{position:relative;z-index:5;display:flex;align-items:center;gap:34px;padding:24px calc(var(--pad) + 440px) 0 var(--pad);background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.p-prog{flex:1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;min-width:0}
.p-prog small,.p-mood small{font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--g2)}
.p-prog .pbar{height:14px;background:var(--c2);border-radius:0;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.p-prog .pbar i{background:var(--w);border-radius:0;transition:width .6s var(--ez)}
.p-prog .pbar i::after{content:'';left:auto;right:0;top:0;bottom:0;width:10px;height:auto;border-radius:0;background:var(--r)}
.p-prog b{font-family:var(--fd);font-weight:400;font-size:22px;letter-spacing:.04em}
.p-mood{display:flex;align-items:center;gap:12px;margin:0;font-weight:800;font-size:14px}
.p-mood .pips{display:flex;gap:4px}
.p-mood .pips i{display:block;width:20px;height:12px;background:var(--c3);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);transition:background .3s}
.p-mood .pips i.on{background:var(--w)}
.p-mood b{font-family:var(--fd);font-weight:400;font-size:18px;letter-spacing:.06em;text-transform:uppercase;min-width:90px}
.p-hearts{display:flex;align-items:baseline;gap:6px;background:var(--r);color:#fff;padding:8px 20px 7px 16px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.p-hearts .hh{font-size:20px}
.p-hearts b{font-family:var(--fd);font-weight:400;font-size:26px;line-height:1}
.p-hearts small{font-weight:800;font-size:12px;opacity:.8}
.p-stage{position:relative;z-index:2;min-height:0;padding:36px var(--pad) 60px;display:flex;flex-direction:column;gap:30px}
.p-kind{position:relative;display:block;margin:0}
.p-kind h2{margin:8px 0 0;font-family:var(--fd);font-weight:400;font-size:clamp(44px,4.2vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:.005em;transform:skewX(-9deg);transform-origin:0 100%;max-width:62%}
.p-kind h2 .kw{display:inline-block;background:var(--w);color:var(--k);padding:.04em .16em 0;margin-right:.08em;transform:rotate(-2deg)}
.p-kind .combo{display:inline-block;margin:14px 0 0;background:var(--r);color:#fff;border-radius:0;font-family:var(--fd);font-weight:400;font-size:18px;letter-spacing:.1em;padding:6px 14px 5px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);animation:pSlam .85s var(--ez) both}
.p-stage-in{min-height:0;flex:1;overflow:auto;padding:4px 4px 10px}
.p-verdict{position:absolute;right:var(--pad);top:40px;z-index:6;display:none;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.p-verdict.on{display:flex}
.p-verdict b{font-family:var(--fd);font-weight:400;font-size:clamp(52px,5.2vw,88px);line-height:.95;text-transform:uppercase;padding:.08em .22em .02em;transform:rotate(-5deg) skewX(-10deg);animation:pStamp .75s var(--ez) both;white-space:nowrap}
.p-verdict small{font-family:var(--fd);font-size:22px;letter-spacing:.1em;padding:5px 14px 4px;transform:rotate(-5deg) skewX(-10deg);animation:pIn .85s var(--ez) .15s both}
.p-verdict.good b{background:var(--w);color:var(--k);box-shadow:10px 10px 0 var(--k),10px 10px 0 3px var(--w)}
.p-verdict.good small{background:var(--k);color:var(--w);outline:2px solid var(--w)}
.p-verdict.bad b{background:var(--r);color:#fff;box-shadow:10px 10px 0 var(--k),10px 10px 0 3px var(--r)}
.p-verdict.bad small{background:var(--w);color:var(--r)}
@keyframes pStamp{0%{transform:rotate(-5deg) skewX(-10deg) scale(2.4);opacity:0}55%{transform:rotate(-5deg) skewX(-10deg) scale(.94);opacity:1}100%{transform:rotate(-5deg) skewX(-10deg) scale(1)}}

/* zone de dialogue en bas */
.p-dlgzone{position:relative;z-index:3;display:grid;grid-template-columns:clamp(250px,19vw,370px) minmax(0,1fr) clamp(400px,34vw,620px);align-items:end;gap:0 clamp(28px,2.6vw,48px);padding:0 var(--pad) 40px}
.p-portrait{position:relative;align-self:end;height:clamp(210px,25vh,300px);z-index:4}
.p-portrait .pf-back{position:absolute;left:0;right:6%;bottom:0;height:100%;background:var(--w);clip-path:polygon(10% 0,100% 10%,90% 100%,0 92%)}
.p-portrait .pf-red{position:absolute;left:14%;right:16%;bottom:7%;height:70%;background:repeating-linear-gradient(-60deg,var(--k) 0 3px,transparent 3px 11px);clip-path:polygon(0 18%,100% 0,86% 100%,6% 92%);opacity:.18}
.p-portrait .askm{position:absolute;left:-12%;bottom:-14px;width:118%;transform-origin:50% 100%}
.p-portrait .askm .mon{width:100%;height:auto;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.85))}
.p-portrait .askm.nom{animation:nom .4s ease}
.p-dlg{position:relative;align-self:end;min-height:200px;padding:58px 64px 44px 70px;color:var(--w);margin-left:-60px}
.p-dlg .d-w{position:absolute;inset:0;background:var(--w);clip-path:polygon(1.6% 8%,98.4% 0,100% 84%,96% 100%,4.4% 96%,0 46%)}
.p-dlg .d-k{position:absolute;inset:0;background:var(--k);clip-path:polygon(2.4% calc(8% + 5px),calc(98.4% - 6px) 7px,calc(100% - 8px) 83%,calc(96% - 3px) calc(100% - 9px),calc(4.4% + 4px) calc(96% - 6px),7px 46%)}
.p-dlg .d-r1{position:absolute;left:-14px;top:-18px;width:150px;height:62px;background:var(--r);clip-path:polygon(0 30%,100% 0,82% 100%,8% 86%);z-index:1}
.p-dlg .d-r2{position:absolute;right:46px;bottom:-12px;width:90px;height:24px;background:var(--r);clip-path:polygon(0 0,100% 30%,90% 100%,6% 70%)}
.p-dlg .d-name{position:absolute;left:12px;top:-30px;z-index:2;display:flex;align-items:flex-end;gap:12px}
.p-dlg .d-name b{display:block;font-family:var(--fd);font-weight:400;font-size:34px;letter-spacing:.08em;line-height:1;background:var(--w);color:var(--k);padding:6px 18px 3px;transform:rotate(-4deg) skewX(-12deg);box-shadow:5px 5px 0 var(--k)}
.p-dlg .d-name small{font-weight:900;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--w);background:var(--k);padding:4px 10px;transform:rotate(-4deg) skewX(-12deg);margin-bottom:-6px}
.p-dlg .d-txt{position:relative;z-index:1}
.p-dlg .d-line{margin:0;font-weight:800;font-size:clamp(20px,1.5vw,28px);line-height:1.42;letter-spacing:-.005em;transform:skewX(-3deg)}
.p-dlg .w{display:inline-block;animation:pWord .55s var(--ez) both;animation-delay:calc(var(--i) * 30ms + 320ms)}
@keyframes pWord{from{opacity:0;transform:translate(10px,6px) skewX(-14deg)}}
.p-dlg .blank{display:inline-block;min-width:150px;border:none;border-bottom:4px solid var(--r);background:none;color:var(--w);padding:0 8px;margin:0 2px;text-align:center}
.p-dlg .d-sol{margin:18px 0 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.p-dlg .d-sol small,.p-dlg .d-exp small{display:inline-block;font-weight:900;font-size:11px;letter-spacing:.2em;background:var(--w);color:var(--k);padding:4px 10px;margin-right:10px;transform:skewX(-10deg)}
.p-dlg .d-sol b{font-weight:800;font-size:19px;color:var(--w);background:linear-gradient(transparent 60%,rgba(229,18,46,.85) 60%)}
.p-dlg .d-exp{margin:12px 0 0;font-weight:500;font-size:16.5px;line-height:1.6;color:var(--g1)}
.p-dlg .d-next{position:absolute;right:38px;bottom:22px;width:18px;height:14px;background:var(--r);clip-path:polygon(0 0,100% 0,50% 100%);animation:pNext .9s ease-in-out infinite;z-index:1}
@keyframes pNext{50%{transform:translateY(5px)}}
.p-dlg.is-bad .d-w{background:var(--r)}
.p-dlg.is-good,.p-dlg.is-bad{animation:pShake .45s var(--ez)}
@keyframes pShake{20%{transform:translateX(-8px) skewX(-2deg)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.p-col3{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:26px;align-self:end;min-width:0}
.p-choices{width:100%;display:flex;flex-direction:column;gap:14px}
.p-choices .cw,.p-bank .cw{position:relative;margin-left:calc(var(--i) * 26px);margin-right:calc((3 - var(--i)) * 8px);transform:rotate(calc(-1.6deg + var(--i) * .9deg));filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff);transition:filter .34s,transform .34s var(--ez);animation:pBub .85s var(--ez) both;animation-delay:calc(var(--i) * 95ms + 380ms)}
.p-bank{display:flex;flex-direction:column;gap:10px;width:100%;margin:0}
.p-bank .cw{margin-left:calc(var(--i) * 18px);margin-right:calc((5 - var(--i)) * 6px)}
.p-bank.settled .cw{animation:none}
@keyframes pBub{from{opacity:0;transform:translate(90px,-10px) skewX(-18deg) rotate(calc(-1.6deg + var(--i) * .9deg))}}
.bub{position:relative;display:flex;align-items:center;gap:16px;width:100%;border:none;border-radius:0;background:var(--k);color:var(--w);text-align:left;padding:16px 26px 16px 46px;min-height:62px;font-family:var(--fb);font-weight:800;font-size:clamp(16px,1.18vw,19px);line-height:1.3;box-shadow:none;clip-path:polygon(26px 0,calc(100% - 4px) 4px,100% calc(100% - 10px),calc(100% - 22px) 100%,32px calc(100% - 3px),28px 68%,0 58%,24px 40%);transition:background .3s,color .3s,transform .34s var(--ez)}
.bub .k{flex:none;display:grid;place-items:center;width:30px;height:28px;background:var(--w);color:var(--k);border:none;border-radius:0;font-family:var(--fd);font-weight:400;font-size:17px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);transition:background .3s,color .3s}
.bub .t{flex:1;min-width:0;transform:skewX(-4deg)}
.cw.kb{filter:drop-shadow(3px 0 0 #000) drop-shadow(-3px 0 0 #000) drop-shadow(0 3px 0 #000) drop-shadow(0 -3px 0 #000) drop-shadow(9px 8px 0 var(--r));transform:translateX(-14px) rotate(-1deg) scale(1.025)}
.cw.kb .bub{background:var(--w);color:var(--k)}
.cw.kb .bub .k{background:var(--r);color:#fff}
.cw:has(.sel){filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(10px 9px 0 var(--w));transform:translateX(-20px) rotate(-1.5deg) scale(1.03)}
.bub.sel{background:var(--r);color:#fff;animation:pSel .4s var(--ez)}
.bub.sel .k{background:var(--w);color:var(--r)}
@keyframes pSel{0%{transform:scale(1)}40%{transform:scale(1.05) skewX(-4deg)}100%{transform:none}}
.bub.ok{background:var(--w);color:var(--k)}
.bub.ok .k{background:var(--k);color:#fff}
.bub.ok::after{content:'✔';position:absolute;right:28px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:26px;color:var(--r);font-weight:900}
.cw:has(.ok){filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(10px 9px 0 var(--r));transform:translateX(-18px) rotate(-1deg) scale(1.03)}
.bub.bad{background:var(--k);color:var(--g3);text-decoration:line-through;text-decoration-color:var(--r);text-decoration-thickness:3px;animation:pShake .45s var(--ez)}
.bub.bad .k{background:var(--r);color:#fff}
.bub.bad::after{content:'✕';position:absolute;right:28px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--r);font-weight:900}
.cw:has(.bad){filter:drop-shadow(3px 0 0 var(--r)) drop-shadow(-3px 0 0 var(--r)) drop-shadow(0 3px 0 var(--r)) drop-shadow(0 -3px 0 var(--r))}
.p-lesson:has(.p-foot.good) .cw:not(:has(.ok)):not(:has(.sel)),.p-lesson:has(.p-foot.bad) .cw:not(:has(.ok)):not(:has(.bad)){opacity:.4}
.p-lesson:has(.p-foot.good) .cw.kb,.p-lesson:has(.p-foot.bad) .cw.kb{transform:rotate(calc(-1.6deg + var(--i) * .9deg));filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)}
.p-lesson:has(.p-foot.good) .cw.kb .bub:not(.ok):not(.bad),.p-lesson:has(.p-foot.bad) .cw.kb .bub:not(.ok):not(.bad){background:var(--k);color:var(--w)}
.bub.big{min-height:76px;font-family:var(--fd);font-weight:400;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
.bub.big .t{transform:skewX(-8deg)}
.cw.used{opacity:.22;filter:none;pointer-events:none}
.bub.used{visibility:visible}
/* saisie libre */
.p-type{width:100%;display:flex;flex-direction:column;gap:10px;filter:none!important;margin:0!important;transform:none!important}
.p-type label{font-weight:900;font-size:12px;letter-spacing:.22em;color:var(--g2)}
.p-type .type-in{width:100%;border:none;border-radius:0;background:var(--w);color:var(--k);font-family:var(--fd);font-weight:400;font-size:34px;letter-spacing:.03em;padding:20px 30px 16px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);outline:none;transition:transform .34s var(--ez),background .34s}
.p-type .type-in::placeholder{color:#9A9AA2}
.p-type .type-in:focus{transform:skewX(-4deg);box-shadow:inset 0 -6px 0 var(--r)}
.p-type .type-in.ok{background:var(--w);box-shadow:inset 0 -8px 0 var(--k)}
.p-type .type-in.bad{background:var(--r);color:#fff}
.p-type .tip{color:var(--g3);font-weight:700;font-size:13px;margin:0;text-align:left}
/* bouton vérifier / continuer */
.p-foot{position:relative;z-index:4;border:none;background:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none;animation:none}
.p-foot.good,.p-foot.bad{background:none;animation:none}
.p-go{display:inline-flex;align-items:center;gap:16px;border:none;background:var(--r);color:#fff;font-family:var(--fd);font-weight:400;font-size:30px;letter-spacing:.08em;text-transform:uppercase;line-height:1;padding:20px 40px 17px 44px;clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s,opacity .34s}
.p-go i{font-style:normal;font-family:var(--fb);font-size:16px;font-weight:800;opacity:.75}
.p-go:not(:disabled).kb{background:var(--w);color:var(--k);transform:translate(-4px,-4px) skewX(-7deg);filter:drop-shadow(8px 8px 0 var(--r))}
.p-go:disabled{background:var(--c2);color:var(--g3);cursor:default}
.p-go:not(:disabled){animation:pGoIn .5s var(--ez)}
@keyframes pGoIn{0%{transform:scale(.92) skewX(-10deg)}60%{transform:scale(1.05) skewX(-6deg)}100%{transform:none}}
.p-go.next.good{background:var(--w);color:var(--k)}
.p-go.next.good.kb{background:var(--r);color:#fff;filter:drop-shadow(8px 8px 0 var(--w))}
.p-foot .hint-foot{color:var(--g2);font-weight:800;font-size:15px;letter-spacing:.04em;padding:0;text-align:right}
/* remets dans l'ordre */
.p-order-grid{display:grid;grid-template-columns:minmax(0,1fr) clamp(400px,34vw,600px);gap:0 clamp(28px,2.6vw,48px);align-items:start}
.p-order{min-width:0}
.t-order .p-stage{padding-bottom:30px}
.t-order .p-kind h2{max-width:none}
.p-lesson:has(.p-foot.good) .ord-help,.p-lesson:has(.p-foot.bad) .ord-help{visibility:hidden}
.t-order .p-stage-in{overflow:visible}
.ord-dir{gap:14px;margin:0 0 18px;font-size:14px}
.ord-dir span{border:none;border-radius:0;padding:8px 16px 7px;background:var(--w);color:var(--k)!important;font-weight:900;letter-spacing:.04em;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.ord-dir span.b{background:var(--r);color:#fff!important}
.ord-dir i{height:6px;border-radius:0;background:linear-gradient(90deg,var(--w),var(--r))}
.ord-dir i::before{border-radius:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.55) 9px 12px,transparent 12px 20px)}
.ord-dir i::after{border-left-color:var(--r)}
.ord-slots{border:none;border-radius:0;background:var(--c1);padding:20px 22px;gap:12px 10px;clip-path:polygon(0 0,100% 6px,calc(100% - 8px) 100%,6px calc(100% - 4px))}
.oslot{min-height:54px;flex:1 1 150px;max-width:260px;border:2px dashed var(--c4);border-radius:0;padding:8px 14px 8px 8px;color:var(--g3);font-size:16px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.oslot i{border-radius:0;background:var(--c3);color:var(--g2);font-family:var(--fd);font-weight:400;font-size:17px;width:30px;height:30px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.oslot.next{border-color:var(--w);color:var(--w);animation:none;border-style:solid}
.oslot.next i{background:var(--r);color:#fff}
.oslot.full{border:none;background:var(--w);color:var(--k);font-weight:800;transition:transform .34s var(--ez),background .3s}
.oslot.full i{background:var(--k);color:#fff}
.oslot.full.kb{background:var(--r);color:#fff;transform:translateY(-3px) skewX(-5deg)}
.oslot.full.good{background:var(--w);color:var(--k);box-shadow:inset 0 -5px 0 var(--k)}
.oslot.full.good i{background:var(--k)}
.oslot.full.wrong{background:var(--r);color:#fff;text-decoration:line-through}
.oslot.full.wrong i{background:var(--k)}
.ord-slots.ok .oslot.full{background:var(--w);color:var(--k)}
.ord-arr{color:var(--g2);font-size:18px}
.ord-help{text-align:left;color:var(--g2);font-weight:600;font-size:14.5px;margin:14px 0 0}
/* associer les paires */
.p-pairs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px 40px;max-width:1100px}
.p-pairs .pcol{display:flex;flex-direction:column;gap:12px}
.p-pairs .p-link{font-family:var(--fd);font-size:44px;color:var(--g3)}
.p-pairs .pc{display:block;width:100%;border:none;border-radius:0;background:var(--c1);color:var(--w);font-weight:800;font-size:17px;line-height:1.3;text-align:left;padding:17px 24px 16px;min-height:0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s,opacity .3s;animation:pIn .85s var(--ez) both;animation-delay:calc(var(--i) * 80ms + 320ms)}
.p-pairs .pcol:last-child .pc{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 100%,10px 100%)}
.p-pairs .pc.kb{background:var(--w);color:var(--k);transform:translateX(6px) skewX(-6deg)}
.p-pairs .pcol:last-child .pc.kb{transform:translateX(-6px) skewX(6deg)}
.p-pairs .pc.sel{background:var(--r);color:#fff;transform:scale(1.03) skewX(-6deg)}
.p-pairs .pc.matched{background:var(--w);color:var(--k);opacity:.3;pointer-events:none}
.p-pairs .pc.bad{background:var(--r);color:#fff;animation:pShake .45s var(--ez)}
/* entrée / sortie des questions */
.p-lesson .p-kind h2{animation:pSlam .85s var(--ez) both}
.p-lesson .p-kind .p-kicker{animation:pIn .85s var(--ez) .05s both}
.p-lesson .p-dlg{animation:pDlg .85s var(--ez) .08s both}
.p-lesson .p-portrait{animation:pPort .9s var(--ez) both}
.p-lesson .p-bgfx .qn{animation:pQn .9s var(--ez) both}
.p-lesson .p-order{animation:pIn .85s var(--ez) .15s both}
.p-lesson.first .p-hud{animation:pDown .9s var(--ez) both}
.p-lesson.p-out .p-kind,.p-lesson.p-out .p-stage-in,.p-lesson.p-out .p-verdict{transition:transform .46s var(--ez2),opacity .46s;transform:translateX(-120px) skewX(-14deg);opacity:0}
.p-lesson.p-out .p-col3{transition:transform .46s var(--ez2),opacity .46s;transform:translateX(160px) skewX(-14deg);opacity:0}
.p-lesson.p-out .p-dlg .d-txt{transition:opacity .34s;opacity:0}
@keyframes pSlam{from{opacity:0;transform:translateX(-90px) skewX(-24deg)}to{opacity:1}}
@keyframes pIn{from{opacity:0;transform:translate(-50px,26px) skewX(-12deg)}to{opacity:1}}
@keyframes pDown{from{opacity:0;transform:translateY(-40px)}}
@keyframes pDlg{from{opacity:0;transform:translate(-60px,30px) skewX(-10deg)}}
@keyframes pPort{from{opacity:0;transform:translate(-80px,40px) rotate(-6deg)}}
@keyframes pQn{from{opacity:0;transform:translateX(120px) skewX(-24deg)}}
@keyframes pFrame{from{opacity:0;transform:translate(-40px,30px) skewX(-6deg)}}
/* kawaii / bisous restent au-dessus */
.kiss-ov{z-index:70}

/* =====================================================================
   FIN DE LEÇON
   ===================================================================== */
#end{min-height:100vh;display:block;padding:0}
.p-end{max-width:1500px;margin:0 auto;min-height:100vh;display:grid;grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr);align-items:center;gap:clamp(40px,5vw,96px);padding:80px var(--pad) 70px;text-align:left}
.pe-left{position:relative;display:flex;flex-direction:column;align-items:center}
.pe-slash{position:absolute;inset:6% -4% 16% 4%;background:var(--w);clip-path:polygon(10% 0,100% 12%,88% 100%,0 86%);animation:pFrame .9s var(--ez) both}
#end .pe-port{position:relative;width:min(100%,420px);margin:0;animation:pPort .9s var(--ez) .1s both}
.pe-port .mon{width:100%;height:auto;filter:drop-shadow(8px 8px 0 #000)}
#end .pe-stars{position:relative;display:flex;gap:10px;margin:-10px 0 0;letter-spacing:0}
.pe-stars span{font-size:56px;color:var(--c3);text-shadow:4px 4px 0 #000;animation:pStamp .75s var(--ez) both}
.pe-stars span.on{color:var(--r)}
#end .pe-title{color:var(--w);margin:10px 0 24px;font-family:var(--fd);font-weight:400;font-size:clamp(60px,6vw,104px);line-height:.92;text-transform:uppercase;transform:skewX(-9deg);transform-origin:0 100%;animation:pSlam .85s var(--ez) both}
.pe-say{max-width:720px;animation:pIn .85s var(--ez) .12s both}
.p-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0 22px}
.p-cards .card{background:var(--w);color:var(--k);border:none;border-radius:0;padding:20px 22px 18px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);text-align:left;animation:pIn .85s var(--ez) both}
.p-cards .card:nth-child(1){animation-delay:.2s}.p-cards .card:nth-child(2){animation-delay:.28s}.p-cards .card:nth-child(3){animation-delay:.36s}
.p-cards .card.red{background:var(--r);color:#fff}
.p-cards .card small{display:block;background:none;padding:0;font-weight:900;font-size:11px;letter-spacing:.2em;color:inherit;opacity:.7}
.p-cards .card b{display:block;padding:0;margin-top:6px;font-family:var(--fd);font-weight:400;font-size:40px;line-height:1;color:inherit}
.end-prog.p-card{padding:24px 28px;animation:pIn .85s var(--ez) .44s both}
.end-prog .meter + .meter{margin-top:14px}
.gift{margin-top:18px;background:var(--c2);border:none;border-radius:0;color:var(--w);font-weight:800;padding:14px 20px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.p-end .p-actions{animation:pIn .85s var(--ez) .52s both}
.end-in>*{animation:none}

/* =====================================================================
   COURS
   ===================================================================== */
#cours{background:var(--k)}
.c-top{background:rgba(8,8,10,.94);border-bottom:none;box-shadow:0 1px 0 var(--c2)}
.c-top-in{max-width:1500px;padding:22px calc(var(--pad) + 440px) 12px var(--pad);gap:22px}
.c-top .x{width:52px;height:52px;border-radius:0;border:none;background:var(--c2)}
.c-title b{font-family:var(--fd);font-weight:400;font-size:34px;letter-spacing:.01em;text-transform:uppercase;font-style:normal;transform:skewX(-7deg);transform-origin:0 100%}
.c-nav button{width:50px;height:46px;border-radius:0;border:none;background:var(--c2);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.c-nav button:not(:disabled).kb{background:var(--w);color:var(--k);transform:skewX(-6deg)}
.c-tools{max-width:1500px;padding:6px var(--pad) 18px;gap:8px;overflow:visible;flex-wrap:wrap}
.c-tl{font-weight:900;font-size:11px;letter-spacing:.22em;color:var(--g3);margin-right:6px}
.ct{height:44px;border:none;border-radius:0;background:var(--c2);padding:0 16px;font-size:15px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);transition:transform .34s var(--ez),background .3s,color .3s}
.ct span{font-size:13.5px;font-weight:800}
.ct.kb{background:var(--w);color:var(--k);transform:translateY(-2px) skewX(-6deg)}
.ct.on{background:var(--r);color:#fff;transform:none}
.ct.warn{background:var(--r);color:#fff}
.ct:active{transform:none;border:none}
.sw{border:3px solid var(--k);outline:2px solid var(--c4)}
.sw.on{outline-color:#fff;box-shadow:none;transform:scale(1.18) rotate(-8deg)}
.c-layout{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(36px,4vw,72px);padding:30px var(--pad) 80px}
.c-toc{position:sticky;top:170px;align-self:start;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 200px);overflow:auto;padding-right:6px}
.c-toc .p-kicker{margin-bottom:10px}
.c-toc a{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:baseline;color:var(--g2);text-decoration:none;font-weight:700;font-size:14.5px;line-height:1.35;padding:10px 12px 10px 10px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transition:background .3s,color .3s,transform .34s var(--ez)}
.c-toc a i{font-style:normal;font-family:var(--fd);font-size:15px;color:var(--g3)}

/* ---------- COULEURS ---------- */
const SKINS = {rouge:['#7E0C20','#FF6F91'], violet:['#3A1262','#C89BFF'], ombre:['#1C171E','#8C7A99'], or:['#6E4E00','#FFD95E']};

const mix = (a,b,t) => { const A=hx(a), B=hx(b); return toHex(A.map((v,i)=>v+(B[i]-v)*t)); };
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

   stade 5 : chibi minimaliste

function mon(stage, size, mood, o){
  o = o || {}; stage = clamp(stage|0, 0, 5); size = size || 100;
  let eq = o.equip; if(!eq){ try { eq = S.equip; } catch(e){ eq = {}; } } eq = eq || {};
  const chib = mood==='kiss' || mood==='happy5' || mood==='squish' || mood==='star' || (stage===5 && !mood);
  const inner = chib ? chibi(mood, eq) : kaiju(stage, mood, eq, o);
  const cls = mood || ('s'+stage);
  return `<svg class="mon ${cls}${chib?' chib':''}${o.track?' track':''}${o.manga?' manga':''}" viewBox="0 0 120 120" width="${size}" height="${size}" aria-hidden="true">${inner}</svg>`;
}

/* =========================================================
   LES MONDES — un par unité + l'arène du boss
   Chaque scène : viewBox 400×320, sol vers y=228.
   props : objets cliquables (x,y = position du « ? »), avec un fait du cours.
   nodes : position horizontale (%) des leçons, sur la ligne y=82 %.
   ========================================================= */
function rng(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }
function skyline(seed, y0, minH, maxH, fill, stepMin, stepMax){
  const r = rng(seed); let s = '';
  for(let x=-10; x<410;){ const w = stepMin + r()*(stepMax-stepMin), h = minH + r()*(maxH-minH); s += `<rect x="${x.toFixed(0)}" y="${(y0-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}"/>`; x += w + 1; }
  return `<g fill="${fill}">${s}</g>`;
}
function windows(seed, x, y, w, h, lit, on, off){
  const r = rng(seed); let s = '';
  for(let yy=y+6; yy<y+h-8; yy+=12) for(let xx=x+5; xx<x+w-6; xx+=9){ if(r()<.85) s += `<rect x="${xx}" y="${yy}" width="4" height="6" fill="${r()<lit?on:off}"/>`; }
  return s;
}
function stars(seed, n, ymax){ const r = rng(seed); let s=''; for(let i=0;i<n;i++){ s += `<circle class="tw" style="animation-delay:${(r()*2).toFixed(2)}s" cx="${(r()*400).toFixed(0)}" cy="${(r()*ymax).toFixed(0)}" r="${(.5+r()*1.2).toFixed(1)}" fill="#fff"/>`; } return s; }

{
  title:"Les bases de la com’", sub:"Définitions, origines, les 7 éléments", c:"#FF3B4E", cd:"#A8172A",
  guide:`<p class="lead"><b>L’idée en une phrase :</b> communiquer, c’est <b>mettre quelque chose en commun</b> entre au moins deux pôles (des personnes, des machines, des institutions) grâce à des signes. Le mot est tellement large que tout le cours va proposer <b>plusieurs façons</b> de le regarder.</p>

<h4>Origines du mot</h4><ul>
<li><b>Communicare</b> (latin) = mettre en commun, en relation</li>
<li>France, XVe siècle : communiquer = faire partager une nouvelle, transmettre</li>
<li>Pays anglo-saxons : même sens, puis le mot désigne les industries de la presse, du cinéma, de la radio, de la télé</li>
<li>Un objet d’étude <b>multidisciplinaire</b>, concerné par toutes les disciplines, <b>qui semble avoir perdu de sa cohérence</b></li>
<li>« Trains, autobus, routes, télégraphes, vases, écluses… <b>tous communiquent !</b> »</li></ul>
<div class="clair"><b>En clair</b> Le mot a d’abord voulu dire « partager » (une nouvelle, un bien), puis il a fini par désigner tout un secteur économique (les médias, la pub). Comme tout le monde l’utilise (sociologues, ingénieurs, publicitaires, psychologues), chacun lui donne un sens un peu différent : c’est pour ça que le cours dit qu’il « semble avoir perdu de sa cohérence ».</div>
<div class="ex"><b>Exemple</b> Une écluse « communique » : elle met en relation deux biefs d’un canal. Un train aussi : il relie deux villes. Rien à voir avec des mots, et pourtant c’est le même verbe. C’est la phrase-choc du cours : <i>tous communiquent</i>.</div>

<h4>Les 5 sens du mot</h4><ol>
<li>Établir une relation (émetteur ↔ récepteur)</li><li>Échange d’infos (citoyen ↔ impôts)</li>
<li>Moyens techniques (mail, SMS, téléphone)</li><li>Relier un point A à un point B</li><li>Technique médiatique (la pub)</li></ol>
<table class="tbl"><tr><th>Sens</th><th>Ce que ça veut dire</th><th>Exemple</th></tr>
<tr><td><b>1. Établir une relation</b></td><td>Créer un lien avec quelqu’un ou quelque chose par un échange de signes ou de messages, entre un émetteur et un récepteur</td><td>Un regard, un « salut », un message</td></tr>
<tr><td><b>2. Échanger des infos</b></td><td>Échange entre différents « organes » : matériels, humains, logiciels</td><td>Toi, le site des impôts et l’administration lors d’une déclaration en ligne</td></tr>
<tr><td><b>3. Moyens techniques</b></td><td>Les outils par lesquels on communique</td><td>Mail, SMS, téléphone, internet</td></tr>
<tr><td><b>4. Relier A à B</b></td><td>Le sens physique : ce qui relie deux points dans l’espace</td><td>Une route, une voie ferrée, une écluse</td></tr>
<tr><td><b>5. Technique médiatique</b></td><td>L’information et la publicité diffusées par les médias</td><td>La pub d’une marque sur les réseaux sociaux</td></tr></table>

<h4>Les 7 éléments</h4><ul>
<li><b>Émetteur</b> : celui qui envoie</li><li><b>Récepteur</b> : celui qui reçoit</li>
<li><b>Message</b> : l’info transmise (ce qui est écrit ou dit)</li><li><b>Code</b> : on code, on décode</li>
<li><b>Canal</b> : le support (latin <i>medium</i> = intermédiaire)</li><li><b>Référent</b> : ce dont on parle</li>
<li><b>Contexte</b> : le lieu, le moment, l’actualité</li></ul>
<div class="ex"><b>Exemple complet</b> Tu envoies un SMS à ta mère : « jsp, je rentre vers 22h ».
<table class="tbl"><tr><td><b>Émetteur</b></td><td>toi : celui qui écrit, parle, envoie l’info</td></tr>
<tr><td><b>Récepteur</b></td><td>ta mère : celle qui reçoit, lit, entend (dans une entreprise, ce serait par exemple un client)</td></tr>
<tr><td><b>Message</b></td><td>« je rentre vers 22h » : l’information sous une certaine forme, ce qui est écrit ou dit</td></tr>
<tr><td><b>Code</b></td><td>le français écrit… et l’abréviation « jsp ». Si elle ne connaît pas « jsp », elle ne peut pas décoder : il faut connaître le code pour comprendre le message</td></tr>
<tr><td><b>Canal</b></td><td>le SMS et le réseau téléphonique : le support entre émetteur et récepteur</td></tr>
<tr><td><b>Référent</b></td><td>ton retour à la maison : le sujet du message, ce dont on parle</td></tr>
<tr><td><b>Contexte</b></td><td>un mardi soir, la veille d’un contrôle : le lieu, le moment, l’actualité</td></tr></table></div>
<div class="memo"><b>Astuce mémo</b> <b>Qui</b> (émetteur) dit <b>quoi</b> (message) à <b>qui</b> (récepteur), <b>comment</b> (code + canal), <b>à propos de quoi</b> (référent), <b>où et quand</b> (contexte) ?</div>
<div class="trap"><b>Pièges classiques</b> <b>Code ≠ canal</b> : le code, c’est la « langue » (français, morse, emojis) ; le canal, c’est le « tuyau » (SMS, voix, papier). <b>Message ≠ référent</b> : le message, c’est ce qui est dit ; le référent, c’est la chose dont on parle.</div>

<h4>Les codes de notre univers culturel</h4><ul><li>Couleurs, odeurs, proxémiques, kinésiques, temporels</li></ul>
<div class="clair"><b>En clair</b> On ne communique pas seulement avec des mots : notre culture nous apprend, sans qu’on s’en rende compte, des « règles » sur les couleurs, les odeurs, les distances entre les corps (<b>proxémique</b>), les gestes (<b>kinésique</b>) et le temps (être en retard, attendre son tour…).</div>
<div class="ex"><b>Exemples</b> <b>Couleur</b> : en France, le blanc évoque le mariage ; dans plusieurs pays d’Asie, c’est la couleur du deuil. <b>Temps</b> : arriver 15 minutes en retard est grave à un entretien d’embauche, mais normal à une soirée entre amis.</div>
<div class="why"><b>Pourquoi c’est important</b> Ces codes reviennent dans le cours 4 (la communication orchestrale) : la <b>proxémique</b>, c’est Edward T. Hall ; la <b>kinésique</b>, c’est Ray Birdwhistell.</div>

<div class="exam"><b>Au contrôle, on peut te demander</b><ul>

{
  title:"Histoire des médias", sub:"Le fameux sujet « que des dates »", c:"#FF6A3D", cd:"#A8401B",
  guide:`<p class="lead"><b>L’idée en une phrase :</b> chaque nouvelle technique (imprimerie, presse, radio, télé, internet) permet à l’information d’aller <b>plus vite, plus loin et vers plus de monde</b>. C’est le fameux sujet « que des dates » : il faut savoir <b>placer chaque date</b> et dire ce qu’elle change.</p>
<div class="sch">PAROLE → MANUSCRIT → IMPRIMÉ (1438-1454) → PRESSE PÉRIODIQUE (1631) → RADIO (1920-1922) → TÉLÉ (1932) → MINITEL → INTERNET</div>

<h4>Les ancêtres du journal</h4><ul>
<li>La curiosité du public ; les conteurs : <b>aèdes grecs, trouvères</b> du Moyen Âge, <b>griots</b> africains</li>
<li>Conserver les récits (Homère, Marco Polo) ; réseaux d’info des empires ; correspondances privées</li>
<li><b>Nouvelles manuscrites</b> : les Avvisi (Venise)</li>
<li><b>Occasionnels</b> : cahiers de 4, 8 ou 16 pages, gravures sur bois, un événement (bataille, funérailles, fêtes)</li>
<li><b>Canards</b> : faits surnaturels, crimes, catastrophes (plus ancien en France : 1529)</li>
<li><b>Libelles</b> : feuilles volantes, polémiques religieuses puis politiques</li></ul>
<div class="clair"><b>En clair</b> Avant d’être un objet (le journal), l’information est un <b>besoin</b>. Trois raisons poussent à la faire circuler : la <b>curiosité</b> du public (d’où les conteurs), le souci de <b>garder la mémoire</b> des grands événements ou de décrire les mondes étrangers (Homère, Marco Polo), et les besoins des <b>administrations</b> : les empires de l’Antiquité et du Moyen Âge faisaient « monter » les infos vers le pouvoir et « descendre » les ordres. S’y ajoutent les <b>correspondances privées</b> (les lettres).</div>
<table class="tbl"><tr><th>Qui ?</th><th>C’est quoi</th></tr>
<tr><td><b>Aèdes</b> (Grèce antique)</td><td>Poètes-chanteurs qui récitaient de mémoire les grands récits, comme ceux attribués à Homère</td></tr>
<tr><td><b>Trouvères</b> (Moyen Âge)</td><td>Poètes et conteurs du nord de la France qui racontaient des histoires en chansons</td></tr>
<tr><td><b>Griots</b> (Afrique)</td><td>Conteurs, mémoire vivante de leur communauté, qui transmettent l’histoire à l’oral</td></tr>
<tr><td><b>Avvisi</b> (Venise)</td><td>Nouvelles écrites <b>à la main</b> : Venise est une ville de marchands, qui ont besoin des nouvelles des ports et des guerres</td></tr></table>

<h4>L’imprimerie et ses premiers imprimés</h4><ul>
<li><b>Entre 1438 et 1454</b> : naissance de l’imprimerie</li></ul>
<div class="clair"><b>En clair</b> Avec l’imprimerie à caractères mobiles (Gutenberg, à Mayence), on peut reproduire un texte <b>en série</b>, vite et pour moins cher qu’à la main. Résultat : de petits imprimés se multiplient. Il y en a trois sortes à bien distinguer.</div>
<table class="tbl"><tr><th></th><th>Forme</th><th>Contenu</th><th>Mot-clé</th></tr>
<tr><td><b>Occasionnels</b></td><td>Petits cahiers de 4, 8 ou 16 pages, parfois illustrés de gravures sur bois</td><td>UN événement important : bataille, funérailles princières, fêtes</td><td>l’événement</td></tr>
<tr><td><b>Canards</b></td><td>Feuilles imprimées</td><td>Faits surnaturels, crimes, catastrophes, tout ce qui est extraordinaire. Le plus ancien connu en France date de <b>1529</b></td><td>le sensationnel (l’ancêtre des faits divers)</td></tr>
<tr><td><b>Libelles</b></td><td>Feuilles volantes</td><td>Polémiques <b>religieuses</b> puis <b>politiques</b></td><td>la polémique (l’ancêtre du tract)</td></tr></table>
<div class="memo"><b>Astuce mémo</b> <b>O</b>ccasionnel = un événement <b>O</b>fficiel · <b>C</b>anard = <b>C</b>rimes et <b>C</b>atastrophes · <b>L</b>ibelle = <b>L</b>itiges (polémiques). Ordre d’apparition dans le cours : occasionnels → canards → libelles.</div>

<h4>La presse périodique</h4><ul>
<li><b>1631</b> : la Gazette de Théophraste Renaudot (1586-1653), journaliste et médecin</li>
<li><b>1790</b> : près de 1 500 titres (pluralisme). Mais le gazetier reste méprisé au XVIIIe</li></ul>
<div class="clair"><b>En clair</b> La Gazette est la <b>première publication périodique en France</b> : « périodique » veut dire qu’elle paraît à intervalles réguliers. C’est ça qui en fait le premier vrai journal, contrairement aux occasionnels qui sortaient au coup par coup. La <b>Révolution française</b> bouleverse ensuite le paysage : après 1789, de nouveaux titres voient le jour, près de <b>1 500 en 1790</b>. C’est un <b>modèle de pluralisme</b> : beaucoup de journaux, donc beaucoup d’opinions différentes.</div>
<div class="trap"><b>Le « mais » du cours</b> Malgré tout, au XVIIIe siècle, le <b>gazetier reste un personnage méprisé</b> : l’élite sociale et intellectuelle voit le journalisme comme une <b>sous-littérature sans valeur ni prestige</b>. Cette nuance est une bonne phrase de copie.</div>

<h4>La radio</h4><ul>
<li><b>1920</b> : radio grand public aux USA</li><li><b>1922</b> : radio en France, émissions depuis la Tour Eiffel</li>
<li><b>1939</b> : l’audience de la radio dépasse 5 millions</li>
<li><b>Années 80</b> : radios libres (fin du monopole public)</li></ul>
<div class="clair"><b>En clair</b> La radio vient de la <b>radiotélégraphie</b> de Guglielmo Marconi (physicien et inventeur italien, 1874-1937) : envoyer des signaux <b>sans fil</b>. En 1920 aux USA, elle devient un média <b>grand public</b>. En France, elle démarre en 1922 sous la <b>double impulsion du public et du privé</b>, et les premières émissions partent de la <b>Tour Eiffel</b>. Avec les annonceurs (la pub qui paie), elle devient un vrai <b>média de masse</b>.</div>
<div class="ex"><b>Pour comprendre</b> Pendant la Seconde Guerre mondiale, la radio devient une arme : propagande nazie d’un côté, Radio Londres (la BBC) pour la Résistance de l’autre ; l’occupant interdit d’écouter les radios étrangères. Dans les années 80, les <b>radios libres</b> mettent fin au <b>monopole public</b> sur l’audiovisuel.</div>

<h4>La télévision</h4><ul>
<li><b>1926</b> : John Logie Baird, 1re démo de télé (notes)</li><li><b>1932</b> : 1res émissions de télé en France (PTT)</li>
<li><b>1939</b> : télé : 15 h/semaine, quelques centaines de spectateurs</li>
<li><b>1964</b> : ORTF (Office de radiodiffusion-télévision française)</li>
<li><b>1984</b> : Canal+, 1re chaîne privée</li><li><b>1985</b> : La 5 et TV6</li>
<li><b>1987</b> : TV6 devient M6 ; TF1 devient privée</li>
<li><b>Fin 80</b> : grands groupes Bouygues, Vivendi, Lagardère Médias</li></ul>
<div class="clair"><b>En clair</b> Les premiers pas de la télé sont <b>anglo-saxons</b> (fin des années 1920 ; l’Écossais John Logie Baird montre la première image télévisée en 1926). En France, l’initiative vient des <b>PTT</b> (Postes, Télégraphes et Téléphones). En 1939, la télé reste un objet rare : 15 h d’émissions par semaine pour quelques centaines de spectateurs. En <b>1964</b>, l’<b>ORTF</b> réunit radio et télé sous le contrôle de l’État. Puis tout bascule vers le <b>privé</b> : Canal+ (1984), La 5 et TV6 (1985), M6 et la privatisation de TF1 (1987), et à la fin des années 80, de très grands groupes de communication.</div>
<div class="trap"><b>Attention à 1987</b> Le cours écrit « 1987, année de création de TF1 ». En réalité TF1 existe déjà, mais c’est l’année où elle <b>devient privée</b>. Si on te demande 1987 : <b>TV6 devient M6</b> et <b>TF1</b>. La pub, elle, arrive à la télé française dans les années 60 (en 1968).</div>
<div class="memo"><b>Astuce mémo</b> Radio : USA <b>1920</b>, France <b>1922</b> (+2 ans). Télé France <b>1932</b> = radio France + 10 ans. Les chaînes privées : <b>84</b> Canal+, <b>85</b> La 5 et TV6, <b>87</b> M6 : trois années à la suite ou presque.</div>

<h4>L’explosion technologique</h4><ul>
<li><b>Années 80-90</b> : le Minitel</li>
<li>Internet, via un fournisseur d’accès (réseau téléphonique, ADSL, fibre optique)</li>
<li><b>Aujourd’hui</b> : 4,2 milliards d’internautes, 55 % de l’humanité</li></ul>
<div class="clair"><b>En clair</b> Le <b>Minitel</b>, c’est un petit terminal branché sur la ligne téléphonique, utilisé en France dans les années 80-90 (annuaire, messageries, réservations) : une sorte de « web français » avant le web. Ensuite, internet arrive dans les foyers grâce à un <b>fournisseur d’accès</b>, par différents moyens : réseau téléphonique, ADSL, fibre. Chiffre du cours à connaître par cœur : <b>4,2 milliards d’internautes, soit 55 % de l’humanité</b>.</div>

<h4>Les dates à connaître</h4>
